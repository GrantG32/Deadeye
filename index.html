    if (this.state === 'play') this.updateStage(wdt);
    this.prompt = P.alive ? this.findInteract() : null;
    // ambience: tumbleweeds, wind dust, train smoke
    for (const tw of this.tumbles) {
      tw.x += tw.vx * wdt; tw.a += tw.vx * wdt / 6; tw.ph += wdt * 5;
      tw.y = GY - 6 - Math.abs(Math.sin(tw.ph)) * 12;
      if (tw.x > this.cam.x + VW + 200) { tw.x = this.cam.x - rand(100, 400); tw.vx = rand(35, 70); }
    }
    const th = this.th;
    if (Math.random() < (th.wind || 0) * wdt * 30) {
      if (th.scroll) part('dust', this.cam.x + VW + 5, rand(60, 320), -rand(400, 600), rand(-10, 10), 1.6, 1, '#8a8ab0', 0);
      else if (th.cave) part('dust', this.cam.x + rand(0, VW), rand(60, 120), rand(-5, 5), rand(10, 25), 4, 1, '#6a5a4a', 0);
      else part('dust', this.cam.x + VW + 5, rand(150, 310), -rand(60, 130), rand(-8, 8), 6, 1, th.crust, 0);
    }
    for (const d of this.deco) if (d.t === 'smokestack' && Math.abs(d.x - this.cam.x - VW / 2) < 420 && Math.random() < wdt * 8) part('smoke', d.x + rand(-3, 3), d.y - d.h - 8, rand(-30, -10), -rand(20, 45), rand(1.2, 2), rand(3, 5), '#4a4a52', -4);
    if (th.scroll) {
      const eng = this.solids.find(s => s.variant === 'engine');
      if (eng && Math.random() < wdt * 25) part('smoke', eng.x + 36 + rand(-3, 3), eng.y - 34, -rand(200, 320), -rand(20, 50), rand(1, 1.6), rand(3, 5), '#5a5a6a', -5);
    }
    // camera & feedback
    this.updateCamera(dt);
    this.trauma = Math.max(0, this.trauma - dt * 1.6);
    if (this.hitmarker > 0) this.hitmarker -= dt;
    if (this.hurtFlash > 0) this.hurtFlash -= dt;
    for (const b of this.bannerQ) b.t += dt;
    if (this.bannerQ.length && this.bannerQ[0].t > this.bannerQ[0].dur) this.bannerQ.shift();
    if (this.bannerQ.length > 3) this.bannerQ.splice(1, 1);
    Sound.listenerX = this.cam.x + VW / 2;
    // music intensity
    if (!this.bossActive && !this.survive && this.state === 'play') {
      const fighting = this.enemies.some(e => !e.dead && e.alert && Math.abs(e.cx - P.cx) < 500);
      Music.setMode(fighting || (this.stages[this.si] && this.stages[this.si].type === 'survive') ? 'combat' : 'explore');
    }
  }

  updatePickups(dt) {
    const P = this.player;
    for (let i = this.picks.length - 1; i >= 0; i--) {
      const p = this.picks[i];
      p.t += dt;
      if (p.dyn) {
        p.vy += GRAV * 0.8 * dt;
        const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
        if (p.vy > 0 && pointSolid(nx, ny)) { p.vy = 0; p.vx *= 0.5; } else { p.x = nx; p.y = ny; }
        if (pointSolid(p.x, p.y - 1)) p.vx = 0;
        p.life -= dt; p.blink = p.life < 3;
        if (p.life <= 0 || p.y > VH + 20) { this.picks.splice(i, 1); continue; }
      }
      if (!P.alive) continue;
      const dx = P.cx - p.x, dy = (P.y + P.h / 2) - (p.y - 4), d = Math.hypot(dx, dy);
      if (p.type === 'cash' && d < 70 && p.t > 0.3) { p.x += dx / d * 240 * dt; p.y += dy / d * 240 * dt; p.vy = Math.min(p.vy, 0); }
      if (p.type === 'gold' || d > 14) continue;
      if (this.collect(p)) { this.picks.splice(i, 1); if (p.id) this.taken.add(p.id); }
    }
  }
  collect(p) {
    const P = this.player;
    switch (p.type) {
      case 'cash': this.run.cash += p.amount; Sound.play('pickup'); floatText(p.x, p.y - 8, '+$' + p.amount, '#ffe070'); return true;
      case 'stash': this.run.cash += p.amount; this.stats.secrets++; Sound.play('gold'); this.banner('HIDDEN STASH', '+$' + p.amount, 1.6); return true;
      case 'health': if (!P.heal(30)) return false; Sound.play('heal'); floatText(p.x, p.y - 8, '+HEALTH', '#ff8a8a', true); return true;
      case 'tonic': if (P.de >= this.pstats.deCap - 1) return false; P.de = Math.min(this.pstats.deCap, P.de + this.pstats.deCap * 0.45); Sound.play('heal'); floatText(p.x, p.y - 8, '+DEAD EYE', '#ffd070', true); return true;
      case 'ammo': {
        let got = false;
        for (const id of P.slots) {
          if (!id) continue;
          const a = P.ammo[id], ws = this.pstats.weapons[id];
          if (a.reserve === Infinity || a.reserve >= ws.reserveMax) continue;
          const add = Math.max(1, Math.round(ws.mag * (id === P.wid ? 1.5 : 0.7) * this.diff.ammo));
          a.reserve = Math.min(ws.reserveMax, a.reserve + add); got = true;
        }
        if (!got) return false;
        Sound.play('ammo'); floatText(p.x, p.y - 8, '+AMMO', '#c8e0a0', true); return true;
      }
    }
    return false;
  }

  updateCamera(dt) {
    const P = this.player, cam = this.cam;
    const look = clamp((P.aimX - P.cx) * (P.ads ? 0.45 : 0.22), P.ads ? -170 : -80, P.ads ? 170 : 80);
    let tx = P.cx + look - VW / 2;
    const B = this.boss;
    if (this.bossActive && B && !B.dead && !B.hidden) { // frame both duelists, never losing the player
      const mid = (P.cx + B.cx) / 2 - VW / 2;
      tx = clamp(B.introT > 0 ? mid : lerp(tx, mid, 0.6), P.cx - VW + 70, P.cx - 70);
    }
    const lo = this.arena && (this.bossActive || this.minX > 0) ? this.arena.x0 : 0;
    const hi = (this.arena && (this.bossActive || this.minX > 0) ? this.arena.x1 : this.width) - VW;
    tx = hi < lo ? (lo + hi) / 2 : clamp(tx, lo, hi);
    cam.x += (tx - cam.x) * (1 - Math.exp(-7 * dt));

  // ---- rendering ----
  render(c, t) {
    const cam = this.cam, sk = Store.settings.shake;

    const sx = Math.round(cam.x + shx), sy = Math.round(cam.y + shy);
    const th = this.th;

    const x0 = sx - 120, x1 = sx + VW + 120;
    c.save(); c.translate(-sx, -sy);

    this.drawPlayer(c, t);
    for (const d of this.dyns) this.drawDynamite(c, d, t);
    for (const r of this.rocks) { px(c, Math.round(r.x) - 3, Math.round(r.y) - 3, 7, 6, '#6a5a4a'); px(c, Math.round(r.x) - 2, Math.round(r.y) - 3, 4, 2, '#8a7a6a'); }
    this.drawBullets(c);

    for (const f of this.overlay) f(c);

    c.restore();

  }

        break;
      case 'pier':

  drawHazard(c, h, t) {
    if (h.type === 'steam') {
      px(c, h.x - 6, h.y - 2, 12, 2, '#3a3a40'); for (let i = 0; i < 12; i += 3) px(c, h.x - 6 + i, h.y - 2, 1, 2, '#1a1a1e');
      if (h.boss && this.bossActive && h.state === 'hiss') this.overlay.push(c2 => { c2.globalAlpha = 0.5 + Math.sin(t * 30) * 0.3; px(c2, h.x - 8, h.y - 90, 1, 90, '#ffffff'); px(c2, h.x + 7, h.y - 90, 1, 90, '#ffffff'); c2.globalAlpha = 1; });
    } else if (h.type === 'fire') {
      px(c, h.x, h.y - 3, h.w, 3, '#3a1a10');
      for (let i = 0; i < h.w; i += 3) { const fh = 4 + Math.abs(Math.sin(t * 9 + i)) * 8 | 0; px(c, h.x + i, h.y - 3 - fh, 2, fh, i % 2 ? '#ff8a30' : '#ffd060'); }
    } else if (h.type === 'rockfall' && h.warned) {
      this.overlay.push(c2 => { c2.globalAlpha = 0.35 + Math.sin(t * 20) * 0.2; px(c2, h.x, GY - 2, h.w, 2, '#ff4030'); c2.globalAlpha = 1; });

  enemyOverlay(e, t) {

      if (e.alertT > 0) pixText(c, '!', x, y - 10, (t * 10 | 0) % 2 ? '#ffe040' : '#ff6030', 1, 'center');
      if (!e.boss && e.hp < e.maxHp) { px(c, x - 8, y - 2, 16, 3, '#1a0c08'); px(c, x - 7, y - 1, Math.max(0, Math.round(14 * e.hp / e.maxHp)), 1, e.armorT ? '#a8b0c0' : '#e04030'); }
      if (e.name && !e.boss) pixText(c, e.name, x, y - 9, '#ffd060', 1, 'center', '#2a1a10');
      if (e.atk === 'aim' && !e.boss) {

  drawPlayer(c, t) {

    if (!P.alive && P.deadT > 3) return;
    const fx = P.cx, fy = P.y + P.h;
    if (P.alive) { c.fillStyle = 'rgba(40,20,10,0.3)'; c.fillRect(Math.round(fx - 7), Math.round(fy), 14, 1); }
    const state = !P.alive ? 'dead' : P.rollT > 0 ? 'roll' : P.crouch ? 'crouch' : !P.onGround ? 'jump' : Math.abs(P.vx) > 20 ? 'run' : 'idle';
    let aim = P.aim;

    else if (P.swapT > 0) aim = P.f > 0 ? 1.2 : Math.PI - 1.2;

      pull: ws.charge ? P.drawT / ws.charge : 0, nocked: P.ammo[P.wid].mag > 0 && P.reloadT <= 0, spin: P.spin,
      lever: P.leverT > 0.1 && P.leverT < 0.3, recoil: P.recoil > 0 ? 1 : 0, recoil2: P.recoil2 > 0 ? 1 : 0, dual: !!ws.dual, aim2: aim + 0.04,

    // ADS aim line
    if (ws.grav && P.alive && P.rollT <= 0 && P.reloadT <= 0) { // arc preview for bow and launcher
      const sh = P.shoulder(), draw = ws.charge ? P.drawT / ws.charge : 1, sp = ws.charge ? lerp(ws.speed, ws.speedMax, draw) : ws.speed;
      let x = sh.x, y = sh.y, vx = Math.cos(P.aim) * sp, vy = Math.sin(P.aim) * sp;

        for (let k = 0; k < 3; k++) { vy += ws.grav / 60; x += vx / 60; y += vy / 60; }

      }
      c.globalAlpha = 1;
    } else if (P.ads && P.alive && P.rollT <= 0) {
      const sh = P.shoulder();
      c.globalAlpha = 0.35;
      for (let i = 24; i < 160; i += 6) px(c, Math.round(sh.x + Math.cos(P.aim) * i), Math.round(sh.y + Math.sin(P.aim) * i), 1, 1, '#fff0c0');
      c.globalAlpha = 1;
    }
  }

  drawDynamite(c, d, t) {
    const x = Math.round(d.x), y = Math.round(d.y);
    px(c, x - 1, y - 3, 3, 5, '#c8302a'); px(c, x, y - 4, 1, 1, (t * 20 | 0) % 2 ? '#ffe060' : '#ff8030');
    const gx = d.landed ? d.x : d.tx, gy = d.landed ? d.y : d.ty;
    this.overlay.push(c2 => {
      const pulse = (t * (d.fuse < 0.6 ? 16 : 6) | 0) % 2;

      c2.beginPath(); c2.ellipse(Math.round(gx) + 0.5, Math.round(gy) + 0.5, 50, 10, 0, 0, TAU); c2.stroke(); c2.globalAlpha = 1;

  }

  drawBullets(c) {
    for (const b of this.bullets.list) {
      const sp = Math.hypot(b.vx, b.vy), k = Math.min(b.team === 'p' ? 22 : 10, b.dist) / sp;
      const tx = b.x - b.vx * k, ty = b.y - b.vy * k;
      if (b.arrow || b.knife) {
        const a = Math.atan2(b.vy, b.vx), L2 = b.arrow ? 9 : 5, ca = Math.cos(a), sa = Math.sin(a);
        for (let i = 0; i < L2; i++) px(c, Math.round(b.x - ca * i), Math.round(b.y - sa * i), 1, 1, i < 2 ? '#d8d8e0' : b.arrow ? (i > L2 - 3 ? '#d83a2e' : '#a8784a') : '#5a3a20');
        continue;
      }
      if (b.explosive) {
        px(c, Math.round(b.x) - 2, Math.round(b.y) - 1, 4, 3, '#c8302a'); px(c, Math.round(b.x), Math.round(b.y) - 2, 1, 1, (b.age * 30 | 0) % 2 ? '#ffe060' : '#ff8030');
        if (Math.random() < 0.5) part('spark', b.x, b.y - 2, rand(-20, 20), rand(-40, 0), 0.15, 1, '#ffd060', 0);

        const s = b.big ? 3 : 2;
        px(c, Math.round(b.x - s / 2), Math.round(b.y - s / 2), s, s, '#ff4a2a'); px(c, Math.round(b.x), Math.round(b.y), 1, 1, '#ffe0c0');
      }
    }
  }

  drawParticles(c) {
    for (const p of this.parts.list) {
      const a = p.life / p.max, x = Math.round(p.x), y = Math.round(p.y);
      switch (p.type) {
        case 'smoke': c.globalAlpha = a * 0.45; pcircle(c, x, y, Math.round(p.size), p.color); c.globalAlpha = 1; break;
        case 'fire': pcircle(c, x, y, Math.max(1, Math.round(p.size * a)), p.color); break;
        case 'flash': { const s = p.size; px(c, x - s, y, s * 2 + 1, 1, '#ffe090'); px(c, x, y - s + 1, 1, s * 2 - 1, '#ffe090'); px(c, x - 1, y - 1, 3, 3, p.color); break; }
        case 'spark': c.strokeStyle = p.color; c.lineWidth = 1; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02); c.stroke(); break;
        case 'stuck': { const an = Math.atan2(p.vy, p.vx), ca = Math.cos(an), sa = Math.sin(an); c.globalAlpha = Math.min(1, a * 3); for (let i = 1; i < 7; i++) px(c, Math.round(p.x - ca * i), Math.round(p.y - sa * i), 1, 1, i > 4 ? '#d83a2e' : '#a8784a'); c.globalAlpha = 1; break; }
        case 'ring': c.strokeStyle = p.color; c.globalAlpha = a; c.lineWidth = 2; c.beginPath(); c.arc(x, y, p.size * (1 - a) * 1.4 + 4, 0, TAU); c.stroke(); c.globalAlpha = 1; break;
        default: if (p.type === 'dust') c.globalAlpha = Math.min(1, a * 1.5); px(c, x, y, p.size, p.size, p.color); c.globalAlpha = 1;
      }

  }

  drawLighting(c, sx, sy, t) {
    const [dc, dx] = Game.darkLayer();
    const dark = clamp(this.th.dark + this.darkBoost, 0, 0.95);
    dx.globalCompositeOperation = 'source-over';
    dx.clearRect(0, 0, VW, VH);
    dx.fillStyle = this.th.cave ? `rgba(8,4,2,${dark})` : `rgba(6,8,24,${dark})`;
    dx.fillRect(0, 0, VW, VH);
    dx.globalCompositeOperation = 'destination-out';
    const L = (x, y, r, i) => {
      x -= sx; y -= sy;
      if (x < -r || x > VW + r) return;
      const g = dx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(0,0,0,${i})`); g.addColorStop(1, 'rgba(0,0,0,0)');
      dx.fillStyle = g; dx.fillRect(x - r, y - r, r * 2, r * 2);
    };

    L(P.cx, P.y + 12, 120, 0.85);
    const fl = 0.9 + Math.sin(t * 13) * 0.05;
    for (const d of this.deco) {
      if (d.t === 'lantern') L(d.x, (d.y || GY) - (d.post ? 32 : -2), 115 * fl, 0.9);
      else if (d.t === 'torch') L(d.x, (d.y || GY) - 28, 80 * fl, 0.9);
      else if (d.t === 'campfire') L(d.x, (d.y || GY) - 6, 100 * fl, 0.95);
      else if (d.t === 'crystal') L(d.x, (d.y || GY) - 4, 26, 0.5);
    }
    for (const s of this.solids) if (s.kind === 'car' && (s.variant === 'pass' || s.variant === 'engine')) L(s.x + s.w / 2, s.y + 14, s.w * 0.6, 0.6);
    for (const h of this.hazards) if (h.type === 'fire') L(h.x + h.w / 2, h.y - 8, 70 * fl, 0.9);
    for (const f of this.flashes) L(f.x, f.y, f.r, f.life / f.max);
    for (const b of this.bullets.list) if (b.team === 'e') L(b.x, b.y, 16, 0.8);
    for (const d of this.dyns) L(d.x, d.y, 24, 0.8);
    for (const e of this.enemies) if (!e.dead && !e.hidden) L(e.cx, e.y + 12, e.boss ? 60 : 38, e.boss ? 0.65 : 0.45); // keep threats readable
    if (this.wagon) L(this.wagon.cx, this.wagon.y + 10, 70, 0.6);
    for (const p of this.picks) if (p.type === 'gold') L(p.x, p.y - 6, 22, 0.7);
    c.drawImage(dc, 0, 0);
  }

  drawSignTips(c) {
    const P = this.player;
    for (const d of this.deco) {
      if (d.t !== 'sign' || !d.tip || Math.abs(d.x - P.cx) > 60) continue;
      const lines = wrapText(fillTokens(d.tip), 30);
      const w = Math.max(...lines.map(l => textW(l))) + 10, h = lines.length * 7 + 7;
      const bx = Math.round(clamp(d.x - w / 2, this.cam.x + 4, this.cam.x + VW - w - 4)), by = GY - 40 - h;
      px(c, bx, by, w, h, '#ecdcb4'); px(c, bx, by, w, 1, '#fff2d0'); px(c, bx, by + h - 1, w, 1, '#8a6a42'); px(c, bx - 1, by + 1, 1, h - 2, '#8a6a42'); px(c, bx + w, by + 1, 1, h - 2, '#8a6a42');
      lines.forEach((l, i) => pixText(c, l, bx + w / 2, by + 4 + i * 7, '#3a2414', 1, 'center'));

}

// ======================================================================
const Game = {
  state: 'menu', w: null, run: null, mission: null, t: 0, bgs: {}, diffKey: 'normal', resultShown: false,

  init() {
    this.canvas = document.getElementById('screen');
    this.ctx = this.canvas.getContext('2d');
    [this.buf, this.bx] = makeCanvas(VW, VH);
    this.resize();
    window.addEventListener('resize', () => this.resize());
    document.addEventListener('fullscreenchange', () => { Store.settings.fullscreen = !!document.fullscreenElement; this.resize(); });
    this.menuScene = { tw: { x: 140, a: 0 }, t: 0 };
  },
  bgFor(theme) { return this.bgs[theme] || (this.bgs[theme] = buildBackground(theme)); },
  darkLayer() { if (!this._dark) this._dark = makeCanvas(VW, VH); return this._dark; },
  resize() {
    const dpr = window.devicePixelRatio || 1, W = Math.floor(innerWidth * dpr), H = Math.floor(innerHeight * dpr);
    this.canvas.width = W; this.canvas.height = H;
    let s = Math.min(W / VW, H / VH);
    if (Store.settings.scaling === 'integer') s = Math.max(1, Math.floor(s));
    const ox = Math.round((W - VW * s) / 2), oy = Math.round((H - VH * s) / 2);
    this.view = { ox, oy, s, W, H };
    Input.view = { ox, oy, s };
    this.ctx.imageSmoothingEnabled = false;
  },

  startMission(id) {
    Sound.init();
    const m = MISSION_BY_ID[id];
    this.mission = m; this.diffKey = Store.save.difficulty;
    this.run = { stats: { kills: 0, headshots: 0, shots: 0, hits: 0, dmgTaken: 0, deaths: 0, secrets: 0 }, cash: 0, time: 0, snap: null, hitShots: new Set(), shotId: 0, rewarded: false, result: null };
    this.build(null);
    this.enterPlay();
    const th = THEMES[this.w.level.theme];
    Sound.setAmbience(th.wind ? 0.12 + th.wind * 0.5 : 0.08, th.windF || 500);
    Music.clack = !!th.scroll;
    if (th.scroll) Sound.play('whistle');
    this.w.banner(m.name.toUpperCase(), m.goals[0], 3);
  },
  build(snap) {
    this.w = new World(this.mission, this.diffKey, snap, this.run);
    this.resultShown = false;
  },
  enterPlay() {
    this.state = 'play'; Input.clearAll(); UI.hideAll(); UI.setGameCursor(true); Sound.setPaused(false);
    Music.setMode('explore');
  },
  respawn() {
    if (!this.run) return;
    this.build(this.run.snap);
    this.enterPlay();
    this.w.banner('BACK IN THE SADDLE', this.w.stageText(), 1.8);
  },
  restartMission() { this.startMission(this.mission.id); },
  pause() {
    if (this.state !== 'play' || !this.w || this.w.state !== 'play') return;
    this.state = 'pause'; Sound.setPaused(true); Input.clearAll(); UI.setGameCursor(false);
    if (document.pointerLockElement) document.exitPointerLock();
    UI.show('pause');
  },
  resume() {
    if (this.state !== 'pause') return;
    this.state = 'play'; Sound.setPaused(false); Input.clearAll(); UI.hideAll(); UI.setGameCursor(true);
  },
  quitToMenu() {
    if (this.w) { this.w.player.setDE(false); }
    Sound.setDeadEye(false); Sound.setPaused(false); Sound.setAmbience(0); Music.clack = false;
    this.w = null; G = null; this.run = null; this.state = 'menu';
    UI.setGameCursor(false);
    if (document.pointerLockElement) document.exitPointerLock();
    Music.setMode('menu');
  },

  grantRewards() {
    const run = this.run;
    if (run.rewarded) return run.result;
    run.rewarded = true;
    const m = this.mission, sv = Store.save, D = DIFFS[this.diffKey];
    const first = !sv.completed[m.id], reps = sv.replays[m.id] || 0;
    const factor = first ? 1 : replayFactor(reps);
    const s = run.stats, acc = s.shots ? s.hits / s.shots : 0, time = run.time;
    const lines = [];
    const base = Math.round(m.reward * D.reward * factor);
    lines.push([first ? 'Bounty reward' : `Replay bounty (${Math.round(factor * 100)}%)`, base]);
    lines.push(['Cash collected', Math.round(run.cash * (first ? 1 : Math.max(0.5, factor)))]);
    if (s.deaths === 0) lines.push(['Untouchable (no deaths)', Math.round(base * 0.15 + 25 * factor)]);
    if (acc >= 0.6 && s.shots >= 10) lines.push(['Dead aim (60%+ accuracy)', Math.round(60 * factor)]);
    if (s.headshots) lines.push([`Headshots x${s.headshots}`, Math.round(Math.min(150, s.headshots * 4) * factor)]);
    if (time <= m.par) lines.push([`Fast work (under ${fmtTime(m.par)})`, Math.round(base * 0.2)]);
    const total = lines.reduce((a, l) => a + l[1], 0);
    sv.cash += total;
    sv.completed[m.id] = true;
    if (!first) sv.replays[m.id] = reps + 1;
    for (const u of (m.unlocks || [])) if (!sv.unlocked.includes(u)) sv.unlocked.push(u);
    if (!sv.bestTimes[m.id] || time < sv.bestTimes[m.id]) sv.bestTimes[m.id] = time;
    sv.stats.kills += s.kills; sv.stats.headshots += s.headshots;
    let legendary = false;
    if (m.id === 'm6' && !sv.finalBeat) {
      sv.finalBeat = true; legendary = true;
      if (!sv.owned.includes('devil')) sv.owned.push('devil');
      const free = sv.loadout.indexOf(null); if (free >= 0) sv.loadout[free] = 'devil';
    }
    Store.commit();
    run.result = { lines, total, first, acc, time, stats: Object.assign({}, s), legendary, unlocks: (first ? m.unlocks || [] : []), mission: m };
    return run.result;
  },

  update(dt) {
    const w = this.w;
    if (!w) return;
    if (Input.hit('pause') && this.state === 'play') { this.pause(); return; }
    w.update(dt);
    if (w.state === 'complete' && w.endT > 2.2 && !this.resultShown) {
      this.resultShown = true; this.state = 'complete'; UI.setGameCursor(false);
      if (document.pointerLockElement) document.exitPointerLock();
      UI.showResults(this.grantRewards());
      Music.setMode('menu');
    }
    if (w.state === 'dead' && w.endT > 2 && !this.resultShown) {
      this.resultShown = true; this.state = 'dead'; UI.setGameCursor(false); Sound.play('failed');
      if (document.pointerLockElement) document.exitPointerLock();
      UI.show('died');
    }
    if (w.state === 'failed' && w.endT > 1.2 && !this.resultShown) {
      this.resultShown = true; this.state = 'failed'; UI.setGameCursor(false); Sound.play('failed');
      if (document.pointerLockElement) document.exitPointerLock();
      UI.show('failed', w.failReason);
    }
  },

  renderMenu(c, t) {
    const bg = this.bgFor('desert');
    drawBackground(c, bg, t * 6, t, 0);
    c.save(); c.scale(2, 2);
    const gy = 150;
    c.fillStyle = bg.pattern; c.fillRect(0, gy, 320, 40);
    px(c, 0, gy, 320, 2, THEMES.desert.crust); px(c, 0, gy + 2, 320, 1, THEMES.desert.crust2);
    drawSaguaro(c, 222, gy, 26, 3); drawBarrelCactus(c, 22, gy, 4); drawBarrelCactus(c, 296, gy, 5);
    drawDeco(c, { t: "skull", x: 196, y: gy }, t); drawDeco(c, { t: 'bush', x: 60, y: gy }, t);
    c.fillStyle = 'rgba(60,30,20,0.25)'; c.fillRect(158, gy, 26, 1); c.fillRect(270, gy, 26, 1);
    drawCharacter(c, LOOKS.player, 170, gy, { f: 1, state: 'idle', t, gun: 'revolver', aim: 1.25, skin: SKINS[Store.save.skin] });
    drawCharacter(c, LOOKS.devil, 282, gy, { f: -1, state: 'idle', t: t + 0.4, gun: 'devil', aim: Math.PI - 1.25, skin: DEVIL_SKIN });
    const tw = this.menuScene.tw;
    tw.x += 0.35; tw.a += 0.06; if (tw.x > 340) tw.x = -20;
    drawTumbleweed(c, tw.x, gy - 5 - Math.abs(Math.sin(t * 4)) * 8, tw.a);
    drawBarrelCactus(c, 30, 180, 9); drawSaguaro(c, 300, 182, 30, 1);
    c.restore();
    for (let i = 0; i < 30; i++) { const x = ((i * 97 - t * (40 + i % 5 * 15)) % (VW + 40) + VW + 40) % (VW + 40) - 20, y = 200 + (i * 37) % 150; px(c, Math.round(x), Math.round(y + Math.sin(t + i) * 3), 1, 1, i % 3 ? '#f6dca8' : '#e8b880'); }
  },

  render(dt) {
    this.t += dt;
    const c = this.bx, w = this.w;
    if (w) w.render(c, this.t); else this.renderMenu(c, this.t);
    const ctx = this.ctx, v = this.view;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0c0806'; ctx.fillRect(0, 0, v.W, v.H);
    ctx.imageSmoothingEnabled = false;
    const de = w && (w.player.deActive || (w.showdown && w.showdown.t > 1.8));
    if (de) ctx.filter = 'sepia(0.8) saturate(1.5) contrast(1.1) brightness(1.02)';
    ctx.drawImage(this.buf, 0, 0, VW, VH, v.ox, v.oy, VW * v.s, VH * v.s);
    ctx.filter = 'none';
    if (Store.settings.crt) { ctx.fillStyle = 'rgba(0,0,0,0.12)'; for (let y = v.oy; y < v.oy + VH * v.s; y += Math.max(2, Math.round(v.s))) ctx.fillRect(v.ox, y, VW * v.s, 1); }
    if (w) this.drawHUD(ctx, w, de);
  },

  // ---------------- HUD (drawn at display resolution for crisp text) ----------------
  drawHUD(ctx, w, de) {

  setGameCursor(on) { document.body.classList.toggle('playing', on); },

  refresh() { if (this.cur) { const y = this.root.querySelector('.scroll') ? this.root.querySelector('.scroll').scrollTop : 0; this.show(this.cur, this.arg); const s = this.root.querySelector('.scroll'); if (s) s.scrollTop = y; } },
  toast(text) {

  confirm(text, yes, yesLabel) {
    this.modalOpen = true;

    const no = document.getElementById('dlg-no');

      const clashes = [];
      for (const a in keys) for (let j = 0; j < 2; j++) if (keys[a][j] === code && !(a === action && j === i)) clashes.push([a, j]);
      keys[action][i] = code;
      let msg = `${ACTIONS.find(a => a[0] === action)[1]} → ${keyLabel(code)}.`;
      for (const [a, j] of clashes) {
        keys[a][j] = old || '';
        if (j === 0 && !keys[a][0]) keys[a][0] = defaultKeys()[a][0] !== code ? defaultKeys()[a][0] : keys[a][1];
        msg += ` ⚠ ${keyLabel(code)} was used by ${ACTIONS.find(x => x[0] === a)[1]} — swapped to ${keyLabel(keys[a][j]) || 'none'}.`;
      }
      this.notice = msg; Store.commitSettings(); this.refresh();
    };
  },
  padRebind(action) {
    this.notice = `Press a controller button for ${PAD_ACTIONS.find(a => a[0] === action)[1]}…`;
    this.refresh();
    if (!navigator.getGamepads || ![...navigator.getGamepads()].some(Boolean)) { this.notice = 'No controller detected. Connect one and press any button.'; this.refresh(); return; }
    Input.padCapture = btn => {
      const pad = Store.settings.pad, old = pad[action];
      let msg = `${PAD_ACTIONS.find(a => a[0] === action)[1]} → ${PAD_NAMES[btn]}.`;
      for (const a in pad) if (a !== action && pad[a] === btn) { pad[a] = old; msg += ` ⚠ ${PAD_NAMES[btn]} was used by ${PAD_ACTIONS.find(x => x[0] === a)[1]} — swapped.`; }
      pad[action] = btn; this.notice = msg; Store.commitSettings(); this.refresh();
    };
  },
  onInput(e) {
    const el = e.target, k = el.dataset.set;
    if (!k) return;
    const s = Store.settings;
    if (el.type === 'checkbox') s[k] = el.checked;
    else if (el.type === 'range') { s[k] = +el.value; const out = el.parentElement.querySelector('output'); if (out) out.textContent = Math.round(+el.value * 100) + '%'; }
    else s[k] = el.value;
    if (k === 'master' || k === 'music' || k === 'sfx') Sound.applyVolumes();
    if (k === 'scaling') Game.resize();
    if (k === 'fullscreen') { this.toggleFullscreen(); }
    if (e.type === 'change') Store.commitSettings();
  },

  afterRender(name) {
    for (const cv of this.root.querySelectorAll('canvas[data-gun]')) {
      const [id, skin] = cv.dataset.gun.split(':');
      const [c, x] = [cv, cv.getContext('2d')];
      x.imageSmoothingEnabled = false; x.clearRect(0, 0, c.width, c.height);
      const sk = id === 'devil' ? DEVIL_SKIN : SKINS[skin];
      const o = { armLen: -2, sleeve: 'rgba(0,0,0,0)', hand: 'rgba(0,0,0,0)', t: Game.t };
      const ox = { rifle: 15, sharp: 13, shotgun: 15, gatling: 13, boom: 13, bow: 15 }[id] || 13;
      if (id === 'dual') { drawGun(x, 'revolver', 9, 4, 0, 1, sk, o); drawGun(x, 'revolver', 18, 8, 0, 1, sk, o); }
      else drawGun(x, id === 'gatling' ? 'gatlingP' : id, ox, 6, 0, 1, sk, Object.assign({ nocked: true }, o));
    }
    for (const cv of this.root.querySelectorAll('canvas[data-face]')) {
      const x = cv.getContext('2d'); x.imageSmoothingEnabled = false; x.clearRect(0, 0, cv.width, cv.height);
      const L = LOOKS[cv.dataset.face];
      drawCharacter(x, L, cv.width / 2, cv.height - 2, { f: 1, state: 'idle', t: 0 });
    }
  },

  // ---------- screens ----------
  r_main() {
    const has = Store.hasSave(), sv = Store.save;
    const warn = Store.warning ? `<div class="warn">${esc(Store.warning)}</div>` : '';
    Store.warning = '';
    return `<div class="main-wrap">
      <div class="title"><h1>DEADEYE</h1><h2>— LAST BULLET —</h2></div>
      <nav class="menu">
        <button class="btn big" data-act="play">${has ? 'New Game' : 'Play'}</button>
        <button class="btn big" data-act="continue" ${has ? 'autofocus' : 'disabled'}>Continue${has ? ` <small>${fmtMoney(sv.cash)}</small>` : ''}</button>
        <button class="btn" data-act="missions">Missions</button>
        <button class="btn" data-act="shop">Weapon Shop</button>
        <button class="btn" data-act="upgrades">Upgrades</button>
        <button class="btn" data-act="settings">Settings</button>
        <button class="btn" data-act="credits">Credits</button>
      </nav>${warn}
      <div class="foot">v1.0 · Mouse + keyboard or controller · Esc pauses</div>
    </div>`;
  },

  header(title, back) {
    return `<header class="bar"><button class="btn small" data-act="${back || 'back'}">◂ Back</button><h3>${esc(title)}</h3><div class="cash">${fmtMoney(Store.save.cash)}</div></header>`;
  },

  r_missions() {
    const sv = Store.save, m = MISSION_BY_ID[this.sel];
    const nodes = MISSIONS.filter(x => !x.side).map((x, i) => {
      const un = sv.unlocked.includes(x.id), done = sv.completed[x.id];
      return `<button class="node ${done ? 'done' : ''} ${x.id === this.sel ? 'sel' : ''} ${x.map[2] === 'up' ? 'up' : ''}" style="left:${x.map[0]}%;top:${x.map[1]}%" data-act="sel" data-v="${x.id}" ${un ? '' : 'disabled'} title="${esc(x.name)}">
        <span class="pin">${done ? '✓' : un ? i + 1 : '🔒'}</span><span class="lbl">${esc(un ? x.name : '???')}</span></button>`;
    }).join('');
    // trail lines: main chain in order, branches drawn from their `from` mission
    let prev = null;
    const segs = MISSIONS.filter(x => !x.side).map(x => { const a = x.from ? MISSION_BY_ID[x.from] : prev; if (!x.from) prev = x; return a ? `<line x1="${a.map[0]}" y1="${a.map[1]}" x2="${x.map[0]}" y2="${x.map[1]}" />` : ''; }).join('');
    const board = MISSIONS.filter(x => x.side).map(x => {
      const un = sv.unlocked.includes(x.id), done = sv.completed[x.id];
      return `<button class="poster ${x.id === this.sel ? 'sel' : ''} ${done ? 'done' : ''}" data-act="sel" data-v="${x.id}" ${un ? '' : 'disabled'}>
        <span class="w">WANTED</span>${un ? `<canvas width="24" height="34" data-face="${x.poster}"></canvas>` : '<div class="unk">?</div>'}
        <span class="n">${esc(un ? x.name.replace('Wanted: ', '') : 'Unknown')}</span><span class="r">${un ? fmtMoney(x.reward) : 'Locked'}</span>${done ? '<span class="stamp">PAID</span>' : ''}</button>`;
    }).join('');
    const un = sv.unlocked.includes(m.id), done = sv.completed[m.id], reps = sv.replays[m.id] || 0;
    const D = DIFFS[sv.difficulty];
    const reward = Math.round(m.reward * D.reward * (done ? replayFactor(reps) : 1));
    const diffBtns = Object.keys(DIFFS).map(k => `<button class="btn small ${sv.difficulty === k ? 'on' : ''}" data-act="diff" data-v="${k}">${DIFFS[k].name}</button>`).join('');
    const lockedReason = !un ? (m.side ? 'Complete more of the campaign to post this bounty.' : 'Complete the previous mission to unlock.') : '';
    return `${this.header('The Frontier', 'main')}
    <div class="tabs"><button class="btn small ${this.tab === 'map' ? 'on' : ''}" data-act="tab" data-v="map">Campaign Map</button><button class="btn small ${this.tab === 'board' ? 'on' : ''}" data-act="tab" data-v="board">Bounty Board</button></div>
    <div class="mission-layout">
      ${this.tab === 'map' ? `<div class="map panel"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${segs}</svg>${nodes}<div class="compass">N</div></div>`
        : `<div class="board panel">${board}</div>`}
      <div class="detail panel">
        <div class="kind">${esc(m.kind)}</div>
        <h4>${esc(un ? m.name : '???')}</h4>
        <p>${esc(un ? m.desc : lockedReason)}</p>
        ${un ? `<ul class="goals">${m.goals.map(g => `<li>${esc(g)}</li>`).join('')}</ul>` : ''}
        ${m.boss && un ? `<div class="bossline">Bounty target: <b>${esc(BOSSES[m.boss].name)}</b></div>` : ''}
        <div class="diffs"><span>Difficulty</span>${diffBtns}</div>
        <div class="rew">${done ? `Replay reward <b>${fmtMoney(reward)}</b> <small>(${Math.round(replayFactor(reps) * 100)}% — falls with each replay)</small>` : `Reward <b>${fmtMoney(reward)}</b> + cash & bonuses`}</div>
        ${sv.bestTimes[m.id] ? `<div class="best">Best time ${fmtTime(sv.bestTimes[m.id])} · Par ${fmtTime(m.par)}</div>` : `<div class="best">Par time ${fmtTime(m.par)}</div>`}
        <button class="btn big ride" data-act="ride" data-v="${m.id}" ${un ? 'autofocus' : 'disabled'}>${done ? 'Ride Again' : 'Ride Out'}</button>
      </div>
    </div>
    <footer class="bar"><button class="btn" data-act="shop">Weapon Shop</button><button class="btn" data-act="upgrades">Upgrades</button><button class="btn" data-act="main">Main Menu</button></footer>`;
  },

  statBars(id) {
    const W = WEAPONS[id], lv = Store.save.weaponLv[id] || 0;
    const dps = W.dmg * (W.pellets || 1) * (1 + lv * 0.1);
    const rows = [['Damage', Math.min(1, dps / 160)], ['Fire rate', Math.min(1, 0.1 / W.fire * 0.9 + 0.08)], ['Range', Math.min(1, W.range / 1400)], ['Capacity', Math.min(1, W.mag / 12)], ['Reload', Math.min(1, 0.9 / (W.reload * (1 - lv * 0.07)))]];
    return `<div class="stats">${rows.map(([n, f]) => `<div class="st"><span>${n}</span><i><b style="width:${Math.round(f * 100)}%"></b></i></div>`).join('')}</div>`;
  },

  r_shop() {
    const sv = Store.save;
    const tabs = `<div class="tabs">${[['weapons', 'Weapons'], ['skins', 'Weapon Skins']].map(([k, n]) => `<button class="btn small ${this.shopTab === k ? 'on' : ''}" data-act="shopTab" data-v="${k}">${n}</button>`).join('')}</div>`;
    let body = '';
    if (this.shopTab === 'weapons') {
      const loadout = `<div class="loadout panel"><span>Loadout (keys 1-4)</span>${sv.loadout.map((w, i) => `<div class="slot"><b>${i + 1}</b>${w ? esc(WEAPONS[w].name) : '<em>empty</em>'}</div>`).join('')}</div>`;
      body = loadout + `<div class="grid scroll">${WEAPON_ORDER.map(id => {
        const W = WEAPONS[id], owned = sv.owned.includes(id), locked = this.weaponLocked(id), lv = sv.weaponLv[id] || 0, slot = sv.loadout.indexOf(id);
        let state = '', btns = '';
        if (locked) { state = '<span class="tag lock">Locked</span>'; btns = `<div class="req">${W.legendary ? 'Defeat The Devil\'s Hand' : 'Complete “' + esc(MISSION_BY_ID[W.req].name) + '”'}</div>`; }
        else if (!owned) { state = '<span class="tag">For sale</span>'; btns = `<button class="btn" data-act="buyW" data-v="${id}" ${sv.cash < W.price ? 'disabled' : ''}>Buy ${fmtMoney(W.price)}</button>`; }
        else {
          state = slot >= 0 ? `<span class="tag eq">Equipped · slot ${slot + 1}</span>` : '<span class="tag own">Owned</span>';
          const cost = weaponUpgradeCost(id, lv);
          btns = `<button class="btn small" data-act="equipW" data-v="${id}">${slot >= 0 ? 'Unequip' : 'Equip'}</button>` +
            (lv < WEAPON_UPG_MAX ? `<button class="btn small" data-act="upW" data-v="${id}" ${sv.cash < cost ? 'disabled' : ''}>Upgrade ${fmtMoney(cost)}</button>` : '<span class="tag own">Fully upgraded</span>');
        }
        return `<div class="card panel ${locked ? 'locked' : ''}"><div class="ch"><h5>${esc(W.name)}</h5>${state}</div>
          <canvas width="36" height="12" data-gun="${id}:${sv.skin}"></canvas>
          <p>${esc(W.desc)}</p>${this.statBars(id)}
          <div class="pips">Upgrade ${'◆'.repeat(lv)}${'◇'.repeat(WEAPON_UPG_MAX - lv)} <small>+10% dmg, -7% reload per level</small></div>
          <div class="row">${btns}</div></div>`;
      }).join('')}</div>`;
    } else {
      body = `<p class="note">Skins are cosmetic only and apply to all your weapons.</p><div class="grid scroll">${SKIN_ORDER.map(id => {
        const S = SKINS[id], owned = sv.skins.includes(id), locked = S.reqFinal && !sv.finalBeat, eq = sv.skin === id;
        const btn = eq ? '<span class="tag eq">Equipped</span>' : owned ? `<button class="btn small" data-act="equipS" data-v="${id}">Equip</button>`
          : locked ? '<span class="tag lock">Defeat The Devil\'s Hand</span>' : `<button class="btn small" data-act="buyS" data-v="${id}" ${sv.cash < S.price ? 'disabled' : ''}>Buy ${fmtMoney(S.price)}</button>`;
        return `<div class="card panel skin ${locked ? 'locked' : ''}"><div class="ch"><h5>${esc(S.name)}</h5></div>
          <canvas width="36" height="12" data-gun="revolver:${id}"></canvas><canvas width="36" height="12" data-gun="rifle:${id}"></canvas>
          <div class="row">${btn}</div></div>`;
      }).join('')}</div>`;
    }
    return `${this.header('Weapon Shop')}${tabs}<div class="shop-body">${body}</div>`;
  },

  r_upgrades() {
    const cols = UPGRADES.map(c => `<div class="ucol panel"><h5>${esc(c.cat)}</h5>${c.items.map(u => {
      const lv = Store.up(u.id), max = lv >= u.max, cost = upgradeCost(u.base, lv);
      return `<div class="upg"><div class="un">${esc(u.name)}</div><div class="pips">${'◆'.repeat(lv)}${'◇'.repeat(u.max - lv)}</div>
        <div class="fx">Now: ${esc(lv ? u.fx(lv) : 'none')}</div>${max ? '<div class="fx done">Maxed</div>' : `<div class="fx next">Next: ${esc(u.fx(lv + 1))}</div>
        <button class="btn small" data-act="buyU" data-v="${u.id}" ${Store.save.cash < cost ? 'disabled' : ''}>${fmtMoney(cost)}</button>`}</div>`;
    }).join('')}</div>`).join('');
    return `${this.header('Upgrades')}<div class="ugrid scroll">${cols}</div>`;
  },

  r_settings() {
    const s = Store.settings;
    const tabs = [['audio', 'Audio'], ['game', 'Gameplay'], ['display', 'Display'], ['keys', 'Keyboard'], ['pad', 'Controller']];
    const slider = (k, label, min = 0, max = 1, step = 0.05) => `<label class="set"><span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${s[k]}" data-set="${k}"><output>${Math.round(s[k] * 100)}%</output></label>`;
    const toggle = (k, label) => `<label class="set"><span>${label}</span><input type="checkbox" data-set="${k}" ${s[k] ? 'checked' : ''}></label>`;
    const select = (k, label, opts) => `<label class="set"><span>${label}</span><select data-set="${k}">${opts.map(([v, n]) => `<option value="${v}" ${s[k] === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>`;
    let body = '';
    switch (this.setTab) {
      case 'audio': body = slider('master', 'Master volume') + slider('music', 'Music volume') + slider('sfx', 'Sound effects volume'); break;
      case 'game': body = slider('shake', 'Screen shake') + toggle('dmgNumbers', 'Damage numbers') + slider('sensitivity', 'Mouse / stick sensitivity', 0.2, 3, 0.1) + toggle('pointerLock', 'Raw mouse aim (pointer lock)') + select('aimAssist', 'Controller aim assist', [['off', 'Off'], ['low', 'Low'], ['high', 'High']]) +
        `<p class="note">Sensitivity applies to raw mouse aim and controller aiming. Difficulty is chosen per mission on the map.</p>`; break;
      case 'display': body = `<label class="set"><span>Fullscreen</span><button class="btn small" data-act="fullscreen">${document.fullscreenElement ? 'Exit fullscreen' : 'Go fullscreen'}</button></label>` +
        select('scaling', 'Pixel scaling', [['fit', 'Fit to window'], ['integer', 'Integer (sharpest)']]) + toggle('crt', 'Scanlines'); break;
      case 'keys': body = `<div class="binds">${ACTIONS.map(([a, n]) => `<div class="bind"><span>${n}</span><button class="btn small key" data-act="rebind" data-v="${a}:0">${esc(keyLabel(s.keys[a][0]))}</button><button class="btn small key alt" data-act="rebind" data-v="${a}:1">${esc(s.keys[a][1] ? keyLabel(s.keys[a][1]) : '—')}</button></div>`).join('')}
        <div class="bind fixed"><span>Shoot / Aim</span><em>Left / Right mouse</em></div><div class="bind fixed"><span>Switch weapon</span><em>Mouse wheel</em></div><div class="bind fixed"><span>Pause</span><em>Escape</em></div></div>`; break;
      case 'pad': body = `<div class="binds">${PAD_ACTIONS.map(([a, n]) => `<div class="bind"><span>${n}</span><button class="btn small key" data-act="padbind" data-v="${a}">${PAD_NAMES[s.pad[a]]}</button></div>`).join('')}
        <div class="bind fixed"><span>Move / Aim</span><em>Left stick / Right stick</em></div></div>` + slider('padDeadzone', 'Stick deadzone', 0.05, 0.5, 0.01); break;
    }
    return `${this.header('Settings')}<div class="tabs">${tabs.map(([k, n]) => `<button class="btn small ${this.setTab === k ? 'on' : ''}" data-act="setTab" data-v="${k}">${n}</button>`).join('')}</div>
      <div class="settings panel scroll">${body}${this.notice ? `<div class="notice">${esc(this.notice)}</div>` : ''}</div>
      <footer class="bar"><button class="btn" data-act="defaults">Restore Defaults</button><button class="btn" data-act="back">Done</button></footer>`;
  },

  r_credits() {
    return `${this.header('Credits')}<div class="credits panel scroll">
      <h4>DEADEYE: LAST BULLET</h4>
      <p>Design, code, pixel art, sound &amp; music — generated procedurally in the browser. No external assets.</p>
      <p>Everything you see is drawn with Canvas from code; every gunshot, footstep and whistle is synthesized with the Web Audio API.</p>
      <p>Fonts: “Rye” and “VT323” via Google Fonts (falls back to system fonts offline).</p>
      <p>Thanks for riding.</p></div>`;
  },

  r_pause() {
    const w = Game.w;
    return `<div class="center-box panel"><h3>PAUSED</h3><p class="obj">${esc(w ? w.stageText() : '')}</p>
      <button class="btn big" data-act="resume" autofocus>Resume</button>
      <button class="btn" data-act="restartCp">Restart Checkpoint</button>
      <button class="btn" data-act="settings">Settings</button>
      <button class="btn" data-act="quit">Return to Main Menu</button>
      <div class="foot">Move ${bindLabel('left')}/${bindLabel('right')} · Jump ${bindLabel('jump')} · Dodge ${bindLabel('dodge')} · Reload ${bindLabel('reload')} · Dead Eye ${bindLabel('deadeye')} · Crouch ${bindLabel('crouch')}</div></div>`;
  },
  r_died() {
    return `<div class="center-box panel dark"><h3 class="red">YOU DIED</h3><p>The frontier claims another… but not today.</p>
      <button class="btn big" data-act="respawn" autofocus>Respawn at Checkpoint</button>
      <button class="btn" data-act="restartMission">Restart Mission</button>
      <button class="btn" data-act="abandon">Abandon Mission</button></div>`;
  },
  r_failed(reason) {
    return `<div class="center-box panel dark"><h3 class="red">MISSION FAILED</h3><p>${esc(reason || '')}</p>
      <button class="btn big" data-act="respawn" autofocus>Retry from Checkpoint</button>
      <button class="btn" data-act="restartMission">Restart Mission</button>
      <button class="btn" data-act="toMap">Return to Map</button></div>`;
  },
  showResults(r) { this.show('results', r); },
  r_results(r) {
    const s = r.stats;
    const lines = r.lines.map(([n, v]) => `<div class="line"><span>${esc(n)}</span><b>${fmtMoney(v)}</b></div>`).join('');
    const unl = r.unlocks.map(id => `<li>New: ${esc(MISSION_BY_ID[id].name)}</li>`).join('');
    return `<div class="center-box panel results"><h3>BOUNTY COLLECTED</h3><h4>${esc(r.mission.name)}</h4>
      <div class="rstats"><div><small>Enemies</small><b>${s.kills}</b></div><div><small>Headshots</small><b>${s.headshots}</b></div><div><small>Accuracy</small><b>${Math.round(r.acc * 100)}%</b></div><div><small>Time</small><b>${fmtTime(r.time)}</b></div><div><small>Deaths</small><b>${s.deaths}</b></div><div><small>Secrets</small><b>${s.secrets}</b></div></div>
      <div class="lines">${lines}<div class="line total"><span>Total earned</span><b>${fmtMoney(r.total)}</b></div></div>
      ${r.legendary ? `<div class="legend">LEGENDARY WEAPON: DEVIL'S DUE — added to your loadout.<br>The Legendary Gunslinger skin is now for sale.</div>` : ''}
      ${unl ? `<ul class="goals">${unl}</ul>` : ''}
      <button class="btn big" data-act="toMap" autofocus>Continue</button></div>`;
  },
};

</script>
<script>
'use strict';
// Boot + fixed-timestep loop.
Store.load();
Game.init();
Input.init(Game.canvas);
UI.init();
Music.mode = 'menu';
UI.show('main');
for (const ev of ['pointerdown', 'keydown']) window.addEventListener(ev, () => Sound.init());

let lastT = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  dt = clamp(dt, 0, 0.1); // background tabs never cause huge jumps
  Input.pollPad();
  if (Game.state === 'play') {
    acc += dt;
    let n = 0;
    while (acc >= DT && n < 6) { Input.beginTick(); Game.update(DT); acc -= DT; n++; }
    if (n === 6) acc = 0;
  } else { acc = 0; Input.beginTick(); }
  Music.update();
  Game.render(dt);
}
requestAnimationFrame(frame);

// Debug/test handle (used by selftest.js).
window.DE = { Game, Store, UI, Input, get world() { return G; } };

</script>
</body>
</html>
