<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deadeye: Last Bullet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #2a170c; --parch: #ecdcb4; --parch2: #d9c494; --wood: #3a2414; --wood2: #5a3820; --gold: #f0c860; --rust: #b8401e;
  --cream: #f6e8c8; --muted: #b89c74; --red: #d8402a;
  --title: Rye, Georgia, serif; --mono: VT323, 'Courier New', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0c0806; overflow: hidden; color: var(--cream); font-family: var(--mono); font-size: 20px; }
canvas#screen { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
body.playing canvas#screen { cursor: none; }
button { font-family: inherit; }

#ui { position: fixed; inset: 0; display: none; flex-direction: column; padding: 16px clamp(16px, 3vw, 40px); gap: 12px; }
#ui.on { display: flex; }
#ui:not(.screen-main) { background: rgba(14, 8, 4, 0.78); backdrop-filter: blur(2px); }
#ui.screen-pause, #ui.screen-died, #ui.screen-failed, #ui.screen-results { align-items: center; justify-content: center; }

.panel { background: linear-gradient(#3a2414ee, #2a180cee); border: 2px solid #8a6038; box-shadow: inset 0 0 0 2px #1a0e06, 0 6px 0 #0006; border-radius: 4px; padding: 14px; }
.btn { font: 22px var(--mono); color: var(--cream); background: linear-gradient(#7a4a26, #5a321a); border: 2px solid #c08a50; border-bottom-color: #3a2010; border-right-color: #3a2010;
  padding: 6px 16px; cursor: pointer; text-shadow: 0 2px 0 #0008; letter-spacing: 1px; border-radius: 3px; transition: transform .06s, filter .1s; }
.btn:hover:not([disabled]), .btn:focus-visible { filter: brightness(1.25); outline: 2px solid var(--gold); outline-offset: 1px; }
.btn:active:not([disabled]) { transform: translateY(2px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: grayscale(.6); }
.btn.big { font-size: 28px; padding: 8px 22px; }
.btn.small { font-size: 19px; padding: 3px 10px; }
.btn.on { background: linear-gradient(#c08a30, #8a5a1a); border-color: #ffe090; color: #fff6dc; }
.btn.danger { background: linear-gradient(#a03020, #6a1a10); }
.btn small { color: var(--gold); font-size: 18px; margin-left: 8px; }
select, input[type=range] { accent-color: var(--gold); }
select { font: 20px var(--mono); background: #2a180c; color: var(--cream); border: 2px solid #8a6038; padding: 2px 6px; }
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--gold); }

/* main menu */
.main-wrap { display: flex; flex-direction: column; height: 100%; justify-content: center; max-width: 440px; }
.title h1 { font: clamp(52px, 8vw, 104px) var(--title); margin: 0; color: #fbe2a8; letter-spacing: 4px; line-height: .9;
  text-shadow: 0 4px 0 #8a3a14, 0 8px 0 #3a1408, 0 12px 18px #000a; }
.title h2 { font: clamp(20px, 2.4vw, 30px) var(--title); margin: 8px 0 22px 6px; color: #f0b060; text-shadow: 0 3px 0 #3a1408; letter-spacing: 3px; }
.menu { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.menu .btn { min-width: 260px; text-align: left; background: linear-gradient(#5a321ae6, #3a2010e6); }
.foot { color: var(--muted); font-size: 17px; margin-top: 18px; }
.warn { margin-top: 12px; color: #ffb080; background: #3a1408cc; padding: 6px 10px; border-left: 3px solid var(--red); }

/* bars */
header.bar, footer.bar { display: flex; align-items: center; gap: 12px; }
header.bar h3 { font: 34px var(--title); margin: 0; flex: 1; color: #fbe2a8; text-shadow: 0 3px 0 #3a1408; }
footer.bar { justify-content: flex-end; flex-wrap: wrap; }
.cash { font-size: 30px; color: var(--gold); text-shadow: 0 2px 0 #000; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.scroll { overflow-y: auto; min-height: 0; }
.note { color: var(--muted); margin: 4px 0; }

/* missions */
.mission-layout { flex: 1; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 14px; min-height: 0; }
.map { position: relative; background: radial-gradient(circle at 30% 30%, #e8d4a4, #c8a870 70%, #a8844e); border-color: #6a4424; overflow: hidden; min-height: 280px; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map line, .map polyline { fill: none; stroke: #7a3a1a; stroke-width: .6; stroke-dasharray: 1.6 1.2; vector-effect: non-scaling-stroke; stroke-width: 3; }
.compass { position: absolute; right: 14px; top: 10px; font: 26px var(--title); color: #6a3a1a; }
.node { position: absolute; transform: translate(-50%, -50%); background: none; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: var(--ink); font: 19px var(--mono); }
.node .pin { width: 34px; height: 34px; border-radius: 50%; background: #a8401e; border: 3px solid #3a1408; color: #fff2d0; display: grid; place-items: center; font-size: 20px; box-shadow: 0 3px 0 #3a1408; }
.node.done .pin { background: #4a7a3a; }
.node.sel .pin { outline: 3px solid #fff2a0; transform: scale(1.12); }
.node .lbl { background: #f0e0b8ee; padding: 0 6px; margin-top: 4px; border: 1px solid #8a6038; white-space: nowrap; }
.node[disabled] { cursor: not-allowed; opacity: .6; }
.node.up { flex-direction: column-reverse; }
.node.up .lbl { margin: 0 0 4px; }
.node[disabled] .pin { background: #6a5a4a; }
.board { display: flex; flex-wrap: wrap; gap: 14px; align-content: flex-start; background: #5a3a20; background-image: repeating-linear-gradient(90deg, #00000018 0 2px, transparent 2px 40px); overflow-y: auto; }
.poster { position: relative; width: 150px; background: #ead8ac; color: var(--ink); border: 0; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; box-shadow: 0 4px 0 #0006; transform: rotate(-1.5deg); font-family: var(--mono); }
.poster:nth-child(2n) { transform: rotate(1.8deg); }
.poster.sel { outline: 3px solid var(--gold); }
.poster .w { font: 22px var(--title); }
.poster canvas { width: 72px; height: 102px; image-rendering: pixelated; background: #d8c494; }
.poster .unk { width: 72px; height: 102px; display: grid; place-items: center; font-size: 60px; background: #d8c494; }
.poster .n { font-size: 19px; font-weight: bold; text-align: center; }
.poster .r { color: #8a2a10; font-size: 22px; }
.poster .stamp { position: absolute; top: 40%; font: 34px var(--title); color: #b81818cc; transform: rotate(-20deg); border: 3px solid #b81818cc; padding: 0 6px; }
.poster[disabled] { opacity: .55; cursor: not-allowed; }
.detail { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.detail .kind { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; font-size: 17px; }
.detail h4 { font: 30px var(--title); margin: 0; color: #fbe2a8; }
.detail p { margin: 0; color: #e8d4b0; line-height: 1.05; }
.goals { margin: 0; padding-left: 20px; color: #f0dcb4; }
.bossline b { color: #ff8a5a; }
.diffs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.diffs span { color: var(--muted); margin-right: 4px; }
.rew b { color: var(--gold); font-size: 24px; }
.rew small, .best { color: var(--muted); }
.ride { margin-top: auto; }

/* shop */
.shop-body { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.loadout { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 12px; }
.loadout > span { color: var(--muted); }
.slot { background: #00000040; padding: 2px 10px; border: 1px solid #8a6038; }
.slot b { color: var(--gold); margin-right: 6px; }
.slot em { color: #7a6a5a; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding-bottom: 8px; }
.card { display: flex; flex-direction: column; gap: 6px; }
.card.locked { opacity: .65; }
.card .ch { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.card h5 { font: 21px var(--title); margin: 0; color: #fbe2a8; }
.card p { margin: 0; color: #d8c4a0; font-size: 18px; line-height: 1; }
.card canvas { width: 256px; max-width: 100%; height: 88px; image-rendering: pixelated; background: radial-gradient(#5a3a22, #2a180c); border: 1px solid #6a4424; align-self: center; }
.card.skin canvas { height: 66px; }
.tag { font-size: 16px; padding: 0 6px; background: #00000050; border: 1px solid #8a6038; white-space: nowrap; }
.tag.eq { color: #a8f080; border-color: #6a9a4a; }
.tag.own { color: var(--gold); }
.tag.lock { color: #ff9a7a; }
.req { color: #ff9a7a; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stats { display: grid; gap: 2px; }
.st { display: grid; grid-template-columns: 80px 1fr; align-items: center; font-size: 17px; color: var(--muted); }
.st i { height: 8px; background: #1a0e06; border: 1px solid #6a4424; }
.st b { display: block; height: 100%; background: linear-gradient(90deg, #c08a30, #f0c860); }
.pips { color: var(--gold); letter-spacing: 2px; }
.pips small { color: var(--muted); letter-spacing: 0; }

/* upgrades */
.ugrid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; align-content: start; }
.ucol h5 { font: 24px var(--title); margin: 0 0 8px; color: #fbe2a8; }
.upg { border-top: 1px solid #6a4424; padding: 8px 0; display: flex; flex-direction: column; gap: 2px; }
.upg .un { font-size: 22px; color: var(--cream); }
.fx { font-size: 17px; color: var(--muted); }
.fx.next { color: #c8e0a0; }
.fx.done { color: var(--gold); }
.upg .btn { align-self: flex-start; margin-top: 4px; }

/* settings */
.settings { flex: 1; display: flex; flex-direction: column; gap: 10px; max-width: 760px; width: 100%; }
.set { display: grid; grid-template-columns: 260px 1fr 60px; align-items: center; gap: 12px; }
.set output { color: var(--gold); }
.binds { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 6px 18px; }
.bind { display: grid; grid-template-columns: 1fr 90px 90px; gap: 6px; align-items: center; }
.bind.fixed { grid-template-columns: 1fr 186px; color: var(--muted); }
.bind .key { min-width: 80px; }
.bind .alt { opacity: .85; }
.notice { color: #ffe0a0; background: #00000040; border-left: 3px solid var(--gold); padding: 6px 10px; }

/* overlays */
.center-box { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: min(460px, 92vw); max-width: 92vw; text-align: center; }
.center-box h3 { font: 46px var(--title); margin: 0; color: #fbe2a8; text-shadow: 0 4px 0 #3a1408; }
.center-box h3.red { color: #ff6a4a; }
.center-box .btn { min-width: 300px; }
.center-box .obj { color: var(--gold); margin: 0; }
.center-box .foot { font-size: 16px; }
.results h4 { font: 26px var(--title); margin: 0; color: var(--gold); }
.rstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 22px; }
.rstats div { display: flex; flex-direction: column; }
.rstats small { color: var(--muted); }
.rstats b { font-size: 28px; }
.lines { width: 100%; max-width: 420px; }
.line { display: flex; justify-content: space-between; border-bottom: 1px dashed #6a4424; padding: 2px 0; }
.line b { color: var(--gold); }
.line.total { font-size: 26px; border: 0; }
.legend { color: #ff9a6a; border: 2px solid #ff6a3a; padding: 6px 10px; background: #3a0e06aa; }
.credits { max-width: 720px; }
.credits h4 { font: 30px var(--title); margin: 0 0 10px; color: #fbe2a8; }

#modal { position: fixed; inset: 0; display: none; place-items: center; background: #0008; z-index: 5; }
#modal.on { display: grid; }
.dialog { max-width: 460px; text-align: center; }
.dialog p { font-size: 22px; }
.dialog .row { justify-content: center; }

#toasts { position: fixed; left: 50%; bottom: 18%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 6; }
.toast { background: #2a180ce6; border: 2px solid #c08a50; padding: 4px 14px; font-size: 22px; color: var(--cream); transition: opacity .4s, transform .4s; }
.toast.out { opacity: 0; transform: translateY(-10px); }

@media (max-width: 800px) {
  .mission-layout { grid-template-columns: 1fr; overflow-y: auto; }
  .set { grid-template-columns: 1fr; }
  .center-box .btn { min-width: 0; width: 100%; }
}

</style>

<script>
'use strict';
// Shared constants and small helpers used by every module.
const VW = 640, VH = 360;          // internal pixel-art resolution
const DT = 1 / 60;                 // fixed simulation step
const GRAV = 1500;
const GY = 300;                    // default ground line
const TAU = Math.PI * 2;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const choose = a => a[Math.floor(Math.random() * a.length)];
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const sgn = v => v < 0 ? -1 : 1;

function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// Segment (x0,y0)->(x1,y1) vs rect. Returns entry t in [0,1] or -1.
function segRect(x0, y0, x1, y1, r) {
  let tmin = 0, tmax = 1;
  const dx = x1 - x0, dy = y1 - y0;
  if (Math.abs(dx) < 1e-9) { if (x0 < r.x || x0 > r.x + r.w) return -1; }
  else {
    let a = (r.x - x0) / dx, b = (r.x + r.w - x0) / dx;
    if (a > b) { const t = a; a = b; b = t; }
    if (a > tmin) tmin = a; if (b < tmax) tmax = b;
    if (tmin > tmax) return -1;
  }
  if (Math.abs(dy) < 1e-9) { if (y0 < r.y || y0 > r.y + r.h) return -1; }
  else {
    let a = (r.y - y0) / dy, b = (r.y + r.h - y0) / dy;
    if (a > b) { const t = a; a = b; b = t; }
    if (a > tmin) tmin = a; if (b < tmax) tmax = b;
    if (tmin > tmax) return -1;
  }
  return tmin;
}

function angDiff(a, b) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}

const fmtMoney = n => '$' + Math.floor(n).toLocaleString('en-US');
const fmtTime = s => { s = Math.max(0, s); return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };

function mulberry32(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Tiny object pool: reuse dead objects instead of allocating every frame.
function makePool() { return { list: [], free: [] }; }
function spawnFrom(pool) { const o = pool.free.pop() || {}; o.dead = false; pool.list.push(o); return o; }
function sweepPool(pool) {
  const l = pool.list; let j = 0;
  for (let i = 0; i < l.length; i++) { const o = l[i]; if (o.dead) pool.free.push(o); else l[j++] = o; }
  l.length = j;
}
function clearPool(pool) { for (const o of pool.list) pool.free.push(o); pool.list.length = 0; }

function makeCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  return [c, x];
}

</script>

<script>
'use strict';
// Persistence: campaign save + settings, both validated on load.
const SAVE_KEY = 'deadeye_last_bullet_save_v1';
const SETTINGS_KEY = 'deadeye_last_bullet_settings_v1';

function defaultSave() {
  return {
    version: 1, started: false, cash: 0,
    completed: {}, replays: {}, bestTimes: {}, unlocked: ['m1'],
    owned: ['revolver'], loadout: ['revolver', null, null, null], weaponLv: {},
    upgrades: {}, skins: ['walnut'], skin: 'walnut', difficulty: 'normal', finalBeat: false,
    stats: { kills: 0, headshots: 0, deaths: 0 },
  };
}

function defaultKeys() {
  return {
    left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], jump: ['Space', 'KeyW'], crouch: ['KeyS', 'ArrowDown'],
    dodge: ['ShiftLeft', 'ShiftRight'], reload: ['KeyR', ''], interact: ['KeyE', ''], deadeye: ['KeyQ', ''],
    w1: ['Digit1', ''], w2: ['Digit2', ''], w3: ['Digit3', ''], w4: ['Digit4', ''],
  };
}
function defaultPad() {
  return { jump: 0, dodge: 1, reload: 2, interact: 3, deadeye: 4, next: 5, prev: 12, aim: 6, shoot: 7, crouch: 13, pause: 9 };
}
function defaultSettings() {
  return {
    master: 0.8, music: 0.55, sfx: 0.8, shake: 1, dmgNumbers: true, fullscreen: false, scaling: 'fit', crt: false,
    sensitivity: 1, pointerLock: false, aimAssist: 'low', padDeadzone: 0.2, keys: defaultKeys(), pad: defaultPad(),
  };
}

const num = (v, lo, hi, d) => (typeof v === 'number' && isFinite(v)) ? clamp(v, lo, hi) : d;
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);

function validateSave(d) {
  const s = defaultSave();
  if (!isObj(d)) return s;
  s.started = !!d.started;
  s.cash = Math.floor(num(d.cash, 0, 1e9, 0));
  s.finalBeat = !!d.finalBeat;
  if (isObj(d.completed)) for (const k in d.completed) if (MISSION_BY_ID[k] && d.completed[k]) s.completed[k] = true;
  if (isObj(d.replays)) for (const k in d.replays) if (MISSION_BY_ID[k]) s.replays[k] = Math.floor(num(d.replays[k], 0, 999, 0));
  if (isObj(d.bestTimes)) for (const k in d.bestTimes) if (MISSION_BY_ID[k]) { const t = num(d.bestTimes[k], 1, 1e6, 0); if (t) s.bestTimes[k] = t; }
  if (Array.isArray(d.unlocked)) s.unlocked = [...new Set(['m1', ...d.unlocked.filter(id => MISSION_BY_ID[id])])];
  // Anything completed must also unlock what it unlocks (repairs partial saves).
  for (const k in s.completed) for (const u of (MISSION_BY_ID[k].unlocks || [])) if (!s.unlocked.includes(u)) s.unlocked.push(u);
  if (Array.isArray(d.owned)) s.owned = [...new Set(['revolver', ...d.owned.filter(w => WEAPONS[w])])];
  if (Array.isArray(d.loadout)) {
    const seen = new Set();
    s.loadout = [0, 1, 2, 3].map(i => {
      const w = d.loadout[i];
      if (w && s.owned.includes(w) && !seen.has(w)) { seen.add(w); return w; }
      return null;
    });
    if (!s.loadout.some(Boolean)) s.loadout[0] = 'revolver';
  }
  if (isObj(d.weaponLv)) for (const k in d.weaponLv) if (WEAPONS[k]) s.weaponLv[k] = Math.floor(num(d.weaponLv[k], 0, WEAPON_UPG_MAX, 0));
  const upgIds = new Map(UPGRADES.flatMap(c => c.items).map(u => [u.id, u.max]));
  if (isObj(d.upgrades)) for (const k in d.upgrades) if (upgIds.has(k)) s.upgrades[k] = Math.floor(num(d.upgrades[k], 0, upgIds.get(k), 0));
  if (Array.isArray(d.skins)) s.skins = [...new Set(['walnut', ...d.skins.filter(k => SKINS[k])])];
  if (SKINS[d.skin] && s.skins.includes(d.skin)) s.skin = d.skin;
  if (DIFFS[d.difficulty]) s.difficulty = d.difficulty;
  if (isObj(d.stats)) for (const k of ['kills', 'headshots', 'deaths']) s.stats[k] = Math.floor(num(d.stats[k], 0, 1e9, 0));
  return s;
}

function validateSettings(d) {
  const s = defaultSettings();
  if (!isObj(d)) return s;
  for (const k of ['master', 'music', 'sfx', 'shake']) s[k] = num(d[k], 0, 1, s[k]);
  s.sensitivity = num(d.sensitivity, 0.2, 3, 1);
  s.padDeadzone = num(d.padDeadzone, 0.05, 0.5, 0.2);
  s.dmgNumbers = d.dmgNumbers !== false;
  s.fullscreen = !!d.fullscreen;
  s.crt = !!d.crt;
  s.pointerLock = !!d.pointerLock;
  if (['fit', 'integer'].includes(d.scaling)) s.scaling = d.scaling;
  if (['off', 'low', 'high'].includes(d.aimAssist)) s.aimAssist = d.aimAssist;
  if (isObj(d.keys)) for (const a in s.keys) {
    const v = d.keys[a];
    if (Array.isArray(v)) s.keys[a] = [0, 1].map(i => typeof v[i] === 'string' ? v[i].slice(0, 32) : s.keys[a][i]);
  }
  if (isObj(d.pad)) for (const a in s.pad) {
    const v = d.pad[a];
    if (Number.isInteger(v) && v >= 0 && v < 17) s.pad[a] = v;
  }
  return s;
}

function readJSON(key) {
  let raw;
  try { raw = localStorage.getItem(key); } catch (e) { return { ok: false, data: null }; }
  if (raw == null) return { ok: true, data: null };
  try { return { ok: true, data: JSON.parse(raw) }; }
  catch (e) {
    try { localStorage.setItem(key + '_corrupt', raw); } catch (_) {}
    return { ok: false, data: null, corrupt: true };
  }
}
function writeJSON(key, v) {
  try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { return false; }
}

const Store = {
  save: defaultSave(), settings: defaultSettings(), warning: '',
  load() {
    const a = readJSON(SAVE_KEY), b = readJSON(SETTINGS_KEY);
    this.save = validateSave(a.data);
    this.settings = validateSettings(b.data);
    if (a.corrupt || b.corrupt) this.warning = 'Save data was damaged and has been recovered. A backup was kept.';
  },
  hasSave() { return this.save.started; },
  commit() { writeJSON(SAVE_KEY, this.save); },
  commitSettings() { writeJSON(SETTINGS_KEY, this.settings); },
  newGame() { const diff = this.save.difficulty; this.save = defaultSave(); this.save.started = true; this.save.difficulty = diff; this.commit(); },
  up(id) { return this.save.upgrades[id] || 0; },
};

</script>
<script>
'use strict';
// Procedural Web Audio: every sound effect and the music are synthesized, no files needed.
const Sound = {
  ctx: null, master: null, sfxBus: null, musicBus: null, musicFilter: null, duck: null, noiseBuf: null,
  last: {}, wind: null, paused: false, listenerX: 0,

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended' && !document.hidden) this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;

  // coat tails behind
  if (L.coat) { R(-tw / 2 - 1, torsoTop + th, 4, Math.max(2, lh - 2), col(shade(L.coat, -0.1))); }
  // backpack tank (Iron Jack weak point)
  if (L.tank) {
    R(-tw / 2 - 4, torsoTop + 1, 4, th - 1, col(L.tank));
    R(-tw / 2 - 4, torsoTop + 1, 1, th - 1, col(shade(L.tank, 0.3)));
    R(-tw / 2 - 3, torsoTop + 3, 2, 3, flash ? '#fff' : ((st.t || 0) * 4 % 1 < 0.5 ? '#ffb040' : '#ff6a20'));
  }
  leg(fo, fl, pants, boots);
  // torso
  const tx = -Math.floor(tw / 2);
  R(tx, torsoTop, tw, th, col(L.shirt));
  if (L.vest) { R(tx, torsoTop, tw, th, col(L.vest)); R(tx + tw - 3, torsoTop, 2, th - 1, col(L.shirt)); }
  if (L.coat) {
    R(tx - 1, torsoTop, tw + 1, th, col(L.coat));
    R(tx + tw - 3, torsoTop, 2, th, col(L.shirt));
    R(tx + tw - 2, torsoTop, 1, 3, col(L.coatHi || L.coat));
    R(tx + tw - 2, torsoTop + th, 2, Math.max(1, lh - 4), col(L.coat));
  }
  if (L.poncho) {
    for (let i = 0; i < th; i++) R(tx - 1 - (i >> 2), torsoTop + i, tw + 2 + (i >> 2) * 2, 1, col(i === 3 || i === 6 ? L.ponchoHi : L.poncho));
  }
  if (L.apron) {
    R(tx + 4, torsoTop + 3, tw - 5, th + Math.floor(lh / 2) - 2, col(L.apron));
    R(tx + 4, torsoTop + 3, 1, th + Math.floor(lh / 2) - 2, col(shade(L.apron, -0.15)));
    R(tx + 7, torsoTop + 6, 3, 2, col(L.stain)); R(tx + tw - 4, torsoTop + th - 1, 2, 3, col(L.stain)); R(tx + 10, torsoTop + th + 2, 2, 1, col(L.stain));
    R(tx + 4, torsoTop + 2, tw - 5, 1, col('#5a3a24'));
  }
  if (L.armor) {
    R(tx, torsoTop, tw, th - 1, col(L.armor));
    R(tx + 1, torsoTop + 1, tw - 2, 1, col(L.armorHi));
    R(tx + 2, torsoTop + 4, 1, 1, col(L.armorHi)); R(tx + tw - 3, torsoTop + 4, 1, 1, col(L.armorHi));
    R(tx - 1, torsoTop - 1, 4, 3, col(shade(L.armor, 0.15)));
  }
  if (L.suspenders) { R(tx + 2, torsoTop, 1, th, col(L.suspenders)); R(tx + tw - 3, torsoTop, 1, th, col(L.suspenders)); }
  if (L.dynabelt) for (let i = 0; i < 4; i++) R(tx + 1 + i * 2, torsoTop + 1 + i * 2, 2, 2, col(i % 2 ? '#e04030' : '#b02820'));
  if (L.bandolier) for (let i = 0; i < 6; i++) R(tx + 1 + i * 2, torsoTop + i * 2, 2, 2, col(i % 2 ? '#d8b040' : '#4a3020'));
  // belt + holster
  R(tx, legTop - 1, tw, 1, col('#2a1a10'));
  R(tx + tw - 3, legTop - 1, 2, 1, col('#d8b040'));
  if (!L.apron) R(tx - 1, legTop, 2, 4, col('#5a3418'));
  // head
  const hx = -Math.floor(hw / 2) + 1;
  R(hx, headTop, hw, hh, col(L.skin));
  R(hx + hw, headTop + 2, 1, 2, col(L.skin)); // nose
  R(hx + hw - 2, headTop + 2, 1, 1, col('#1a1010'));
  if (L.beard) { R(hx, headTop + 3, hw + 1, 3, col(L.beard)); R(hx + hw - 2, headTop + 4, 2, 1, col(shade(L.skin, -0.2))); }
  if (L.stache) R(hx + hw - 2, headTop + 4, 3, 1, col(L.stache));
  if (L.mask) { R(hx + 1, headTop + 3, hw, 3, col(L.bandana)); R(hx + hw - 1, headTop + 5, 2, 2, col(L.bandana)); }
  if (L.skull) {
    R(hx, headTop, hw + 1, hh, col('#ecebe2'));
    R(hx + hw - 3, headTop + 2, 2, 1, col('#141414')); R(hx + hw - 1, headTop + 2, 1, 1, col('#141414'));
    R(hx + 1, headTop + 4, hw, 1, col('#5a5a5a'));
  }
  if (L.bandana && !L.mask) { R(hx - 1, headTop + hh, hw + 1, 1, col(L.bandana)); R(hx + hw - 2, headTop + hh + 1, 2, 2, col(L.bandana)); }
  if (L.glove) { /* drawn with hand color below */ }
  // ears / hair back
  R(hx, headTop + 1, 1, 3, col(shade(L.skin, -0.15)));
  // hat
  const hc = col(L.hat), hb = col(L.band);
  switch (L.style) {
    case 'wide':
      R(hx - 3, headTop, hw + 6, 1, hc); R(hx - 3, headTop - 1, 1, 1, hc); R(hx + hw + 2, headTop - 1, 1, 1, hc);
      R(hx, headTop - 1, hw, 1, hb); R(hx, headTop - 3, hw, 2, hc); R(hx + 2, headTop - 3, 2, 1, col(shade(L.hat, -0.2)));
      break;
    case 'low':
      R(hx - 2, headTop, hw + 4, 1, hc); R(hx, headTop - 1, hw, 1, hb); R(hx, headTop - 2, hw, 1, hc);
      break;
    case 'sombrero':
      R(hx - 5, headTop, hw + 10, 1, hc); R(hx - 6, headTop - 1, 1, 1, hc); R(hx + hw + 5, headTop - 1, 1, 1, hc);
      R(hx, headTop - 1, hw, 1, hb); R(hx + 1, headTop - 4, hw - 2, 3, hc); R(hx + 2, headTop - 5, hw - 4, 1, hc);
      break;
    case 'top':
      R(hx - 2, headTop, hw + 4, 1, hc); R(hx, headTop - 6, hw, 6, hc); R(hx, headTop - 2, hw, 1, hb); R(hx, headTop - 6, 1, 6, col(shade(L.hat, 0.2)));
      break;
    case 'bowler':
      R(hx - 1, headTop, hw + 2, 1, hc); R(hx, headTop - 1, hw, 1, hb); R(hx + 1, headTop - 3, hw - 2, 2, hc);
      break;
    case 'cap':
      R(hx, headTop - 1, hw, 2, hc); R(hx + hw - 1, headTop, 3, 1, hc); R(hx + hw - 2, headTop - 1, 1, 1, '#ffe070');
      break;
    case 'helmet':
      R(hx - 1, headTop - 2, hw + 2, 4, hc); R(hx - 1, headTop + 2, 2, 4, hc); R(hx, headTop - 2, hw, 1, col(shade(L.hat, 0.2)));
      if (L.visor) R(hx + 2, headTop + 1, hw, 1, flash ? '#fff' : L.visor);
      else R(hx + 2, headTop + 1, hw - 1, 1, '#111');
      break;
  }
  if (st.deadPose || !st.gun) {
    R(tw / 2 - 2, torsoTop + 2, 2, 6, col(sleeve));
    R(tw / 2 - 2, torsoTop + 8, 2, 2, col(L.glove || L.skin));
    return null;
  }
  // gun arm(s)
  const sx = x + f * (tw / 2 - 2), sy = y + torsoTop + 2;
  const skin = st.skin || ENEMY_GUN_SKIN;
  const o = { sleeve: col(sleeve), hand: col(L.glove || L.skin), lever: st.lever, recoil: st.recoil || 0, t: st.t, flash, armLen: L.big ? 5 : 4, pull: st.pull, nocked: st.nocked, spin: st.spin };
  let m2 = null;
  if (st.dual) m2 = drawGun(c, st.gun, x - f * 1, sy + 1, st.aim2 != null ? st.aim2 : st.aim, f, skin, Object.assign({}, o, { sleeve: col(shade(sleeve, -0.25)), recoil: st.recoil2 || 0 }));
  const m = drawGun(c, st.gun, sx, sy, st.aim, f, skin, o);
  return st.dual ? { a: m, b: m2 } : m;
}

// Banded, dithered sky like classic pixel art.
function buildSky(th) {
  const [cv, c] = makeCanvas(VW, VH);
  const cols = th.sky, band = Math.ceil(VH * 0.8 / cols.length);
  for (let i = 0; i < cols.length; i++) px(c, 0, i * band, VW, VH, cols[i]);
  for (let i = 1; i < cols.length; i++) {
    c.fillStyle = cols[i - 1];
    for (let y = i * band; y < i * band + 3; y++) for (let x = (y % 2); x < VW; x += 2) c.fillRect(x, y, 1, 1);
  }
  if (th.stars) { const r = mulberry32(7); for (let i = 0; i < 120; i++) px(c, r() * VW | 0, r() * 200 | 0, 1, 1, r() < 0.2 ? '#ffffff' : '#9aa0c8'); }
  return cv;
}

function profileLayer(w, h, seed, kind, th, colA, colB) {
  const [cv, c] = makeCanvas(w, h);
  const r = mulberry32(seed), hs = new Float32Array(w);
  if (kind === 'mesa') {
    const n = Math.ceil(w / 170);
    for (let k = 0; k < n; k++) {
      const cx = r() * w, top = 20 + r() * 50, tw2 = 30 + r() * 80, steps = 3 + (r() * 3 | 0), height = h * (0.35 + r() * 0.55);
      for (let x = -w; x < w * 2; x++) {
        const d = Math.abs(x - cx); let hv = 0;
        if (d < tw2 / 2) hv = height;
        else { const s = Math.floor((d - tw2 / 2) / (top / steps)); hv = height * (1 - (s + 1) / (steps + 1)) - (d - tw2 / 2) * 0.15; }
        const xx = ((x % w) + w) % w;
        if (hv > hs[xx]) hs[xx] = hv;
      }
    }
  } else {
    const a = r() * 10, b = r() * 10;
    for (let x = 0; x < w; x++) hs[x] = h * 0.35 + Math.sin(x / w * TAU * 2 + a) * h * 0.12 + Math.sin(x / w * TAU * 5 + b) * h * 0.06;
  }
  for (let x = 0; x < w; x++) {
    const top = Math.round(h - hs[x]);
    px(c, x, top, 1, h - top, colA);
    const prev = hs[(x - 1 + w) % w];
    if (hs[x] - prev > 0.3 || x % 37 < 2) px(c, x, top, 1, Math.min(h - top, 30), colB);
    px(c, x, top, 1, 1, colB);
  }
  // strata lines
  c.globalCompositeOperation = 'source-atop';
  for (let y = 8; y < h; y += 9) px(c, 0, y, w, 1, shade(colA, -0.07));
  c.globalCompositeOperation = 'source-over';
  return cv;
}

function buildTownLayer(w, h, th) {
  const [cv, c] = makeCanvas(w, h);
  const r = mulberry32(31);
  let x = 0;
  while (x < w) {
    const bw = 40 + r() * 50 | 0, bh = 30 + r() * 40 | 0;
    px(c, x, h - bh, bw, bh, th.near);
    px(c, x + 4, h - bh - 6, bw - 8, 6, th.near);
    for (let wx = x + 6; wx < x + bw - 8; wx += 12) px(c, wx, h - bh + 10, 5, 7, shade(th.near, -0.2));
    x += bw + (r() * 20 | 0);
  }
  return cv;
}
function buildFortLayer(w, h, th) {
  const [cv, c] = makeCanvas(w, h);
  for (let x = 0; x < w; x += 5) { const lh = 46 + ((x * 7) % 5); px(c, x, h - lh, 4, lh, th.near); px(c, x + 1, h - lh - 2, 2, 2, th.near); }
  for (const tx of [120, 520, 900]) { px(c, tx, h - 90, 34, 90, shade(th.near, -0.1)); px(c, tx - 4, h - 96, 42, 6, th.near); px(c, tx + 6, h - 116, 22, 20, th.near); px(c, tx + 2, h - 120, 30, 4, th.near); }
  return cv;
}

function buildCloud(r, th) {
  const w = 40 + r() * 50 | 0, h = 18;
  const [cv, c] = makeCanvas(w, h + 4);
  const n = 4 + (r() * 3 | 0);
  for (let i = 0; i < n; i++) { const cx = 8 + r() * (w - 16) | 0, cy = 10 + r() * 4 | 0, rr = 5 + r() * 6 | 0; pcircle(c, cx, cy, rr, th.cloudsShade); }
  for (let i = 0; i < n; i++) { const cx = 8 + r() * (w - 16) | 0, cy = 8 + r() * 3 | 0, rr = 4 + r() * 5 | 0; pcircle(c, cx, cy, rr, th.clouds); }
  c.clearRect(0, h, w, 4);
  return cv;
}

function buildGroundPattern(th) {
  const [cv, c] = makeCanvas(64, 64);
  const r = mulberry32(99);
  px(c, 0, 0, 64, 64, th.rock[3]);
  for (let row = 0; row < 64; row += 8) {
    let x = -(r() * 10 | 0);
    while (x < 64) {
      const w = 9 + (r() * 9 | 0), colI = r() < 0.5 ? 1 : r() < 0.6 ? 0 : 2;
      const cl = th.rock[colI];
      px(c, x + 1, row + 1, w - 2, 6, cl);
      px(c, x + 1, row + 1, w - 2, 1, shade(cl, 0.15));
      px(c, x + 1, row + 6, w - 2, 1, shade(cl, -0.25));
      x += w;
    }
  }
  return c.createPattern(cv, 'repeat');
}

function buildBackground(themeName) {
  const th = THEMES[themeName];
  const bg = { th, sky: buildSky(th), layers: [], clouds: [], pattern: buildGroundPattern(th) };
  if (th.cave) {
    const [cv, c] = makeCanvas(512, VH);
    c.fillStyle = buildGroundPattern({ rock: ['#3a2a20', '#31231a', '#281c15', '#1c140f'] }); c.fillRect(0, 0, 512, VH);
    for (let x = 30; x < 512; x += 128) { px(c, x, 60, 6, 240, '#3a2614'); px(c, x + 70, 60, 6, 240, '#3a2614'); px(c, x - 6, 56, 88, 8, '#4a3018'); px(c, x - 6, 56, 88, 1, '#6a4a28'); }
    bg.layers.push({ cv, f: 0.5, y: 0 });
  } else {
    if (th.clouds) { const r = mulberry32(5); for (let i = 0; i < 7; i++) bg.clouds.push({ cv: buildCloud(r, th), x: r() * 1400, y: 18 + r() * 90, f: 0.04 + r() * 0.05, s: 3 + r() * 4 }); }
    bg.layers.push({ cv: profileLayer(1280, 160, 11, 'mesa', th, th.far, th.farHi), f: 0.08, y: VH - 160 - 70 });
    bg.layers.push({ cv: profileLayer(1024, 120, 23, th.canyon ? 'mesa' : 'hill', th, th.mid, th.midHi), f: 0.2, y: VH - 120 - 50 });
    if (th.town) bg.layers.push({ cv: buildTownLayer(1100, 90, th), f: 0.4, y: VH - 90 - 58 });
    if (th.fort) bg.layers.push({ cv: buildFortLayer(1200, 130, th), f: 0.4, y: VH - 130 - 58 });
    if (th.canyon) bg.layers.push({ cv: profileLayer(900, 200, 41, 'mesa', th, th.near, shade(th.near, 0.12)), f: 0.4, y: VH - 200 - 50 });
  }
  return bg;
}

function drawBackground(c, bg, camx, t, scroll) {
  const th = bg.th;
  c.drawImage(bg.sky, 0, 0);
  if (th.sun) {
    const [sx, sy, r, cl] = th.sun;
    c.globalAlpha = 0.25; pcircle(c, sx, sy, r + 14, '#fff8e8'); c.globalAlpha = 0.35; pcircle(c, sx, sy, r + 6, '#fff8e8'); c.globalAlpha = 1;
    pcircle(c, sx, sy, r, cl);
    c.globalAlpha = 0.3; pcircle(c, sx + 60, sy + 70, 8, '#fff8e8'); pcircle(c, sx + 90, sy + 100, 5, '#fff8e8'); c.globalAlpha = 1;
  }
  if (th.moon) { const [mx, my, r] = th.moon; c.globalAlpha = 0.2; pcircle(c, mx, my, r + 8, '#c8c8ff'); c.globalAlpha = 1; pcircle(c, mx, my, r, '#f0ecd8'); pcircle(c, mx + 4, my - 3, 3, '#d8d4c0'); pcircle(c, mx - 5, my + 4, 2, '#d8d4c0'); }
  if (th.stars) for (let i = 0; i < 12; i++) if (Math.sin(t * 2 + i * 7) > 0.6) px(c, (i * 53) % VW, (i * 31) % 180, 1, 1, '#ffffff');
  for (const cl of bg.clouds) {
    const W = 1400, xx = (((cl.x - camx * cl.f - t * cl.s) % W) + W) % W - 100;
    c.drawImage(cl.cv, Math.round(xx), Math.round(cl.y));
  }
  for (const L of bg.layers) {
    const w = L.cv.width, off = ((-(camx * L.f + (scroll || 0) * t * L.f * 0.5)) % w + w) % w;
    const ox = Math.round(off) - w;
    for (let x = ox; x < VW; x += w) c.drawImage(L.cv, x, L.y);
  }
  if (th.haze) { c.fillStyle = th.haze; c.fillRect(0, VH - 120, VW, 70); }
}

// ---------- Props ----------
function drawCrate(c, x, y, w, h, dmg) {
  px(c, x, y, w, h, '#6a4220');
  px(c, x + 1, y + 1, w - 2, h - 2, '#a8743a');
  for (let yy = y + 5; yy < y + h - 2; yy += 5) px(c, x + 1, yy, w - 2, 1, '#8a5a2a');
  px(c, x + 1, y + 1, w - 2, 1, '#c89050');
  for (let i = 1; i < Math.min(w, h) - 1; i++) px(c, x + i, y + h - 1 - i, 2, 1, '#6a4220');
  px(c, x + 1, y + 1, 1, 1, '#3a2a1a'); px(c, x + w - 2, y + 1, 1, 1, '#3a2a1a'); px(c, x + 1, y + h - 2, 1, 1, '#3a2a1a'); px(c, x + w - 2, y + h - 2, 1, 1, '#3a2a1a');
  if (dmg > 0.4) { px(c, x + 5, y + 4, 1, 6, '#3a2010'); px(c, x + 6, y + 9, 3, 1, '#3a2010'); }
  if (dmg > 0.7) { px(c, x + w - 7, y + h - 9, 1, 6, '#3a2010'); px(c, x + w - 9, y + h - 4, 3, 1, '#3a2010'); }

'use strict';
// World entities: physics, bullets, particles, player, enemies, bosses, explosives, wagon, hazards.
let G = null; // active mission world (built by Game)

const COVER_KINDS = new Set(['crate', 'cart', 'barrel']);

// ---------------- physics ----------------
function moveX(e, dx) {
  if (!dx) return;
  e.x += dx;
  for (const s of G.solids) {
    if (!s.move || !overlap(e, s)) continue;
    if (dx > 0) { e.x = s.x - e.w; e.hitWall = 1; } else { e.x = s.x + s.w; e.hitWall = -1; }
    e.hitSolid = s;
  }
}
function moveY(e, dy) {
  const prevBottom = e.y + e.h;
  e.y += dy; e.onGround = false;
  for (const s of G.solids) {
    if (!s.move || !overlap(e, s)) continue;
    if (dy > 0) { e.y = s.y - e.h; e.onGround = true; e.ground = s; } else e.y = s.y + s.h;
    e.vy = 0;
  }
  if (dy >= 0 && !e.onGround && !(e.dropT > 0)) {
    for (const p of G.plats) {
      if (e.x + e.w > p.x && e.x < p.x + p.w && prevBottom <= p.y + 0.5 && e.y + e.h >= p.y) {
        e.y = p.y - e.h; e.vy = 0; e.onGround = true; e.ground = p;
      }
    }
  }
}
function physics(e, dt, grav) {
  e.vy = Math.min(e.vy + (grav == null ? GRAV : grav) * dt, 900);
  e.hitWall = 0; e.hitSolid = null;
  const was = e.onGround;
  moveX(e, e.vx * dt);
  moveY(e, e.vy * dt);
  e.landed = !was && e.onGround;
  if (e.dropT > 0) e.dropT -= dt;
  if (e.x < G.minX) { e.x = G.minX; e.vx = 0; e.hitWall = -1; e.hitEdge = true; }
  else if (e.x + e.w > G.maxX) { e.x = G.maxX - e.w; e.vx = 0; e.hitWall = 1; e.hitEdge = true; }
  else e.hitEdge = false;
}
function setHeight(e, h) {
  if (e.h === h) return true;

    for (const s of G.solids) if (s.move && overlap(test, s)) return false;
  }

  return true;
}
function pointSolid(x, y) {
  for (const s of G.solids) if (s.move && x >= s.x && x < s.x + s.w && y >= s.y && y < s.y + s.h) return s;
  for (const p of G.plats) if (x >= p.x && x < p.x + p.w && y >= p.y && y < p.y + 4) return p;
  return null;
}
function groundAhead(e, dir, depth) {
  const fx = dir > 0 ? e.x + e.w + 3 : e.x - 3, fy = e.y + e.h;
  for (let d = 2; d < (depth || 40); d += 6) if (pointSolid(fx, fy + d)) return true;
  return false;
}
// Line of sight; cover-type solids right next to the shooter are ignored (shooting over own cover).
function losClear(x0, y0, x1, y1) {
  for (const s of G.solids) {
    if (s.bullet === false) continue;
    if (COVER_KINDS.has(s.kind) && x0 > s.x - 28 && x0 < s.x + s.w + 28 && y0 < s.y + 6) continue;

const cxOf = e => e.x + e.w / 2;

// ---------------- particles ----------------
function part(type, x, y, vx, vy, life, size, color, grav) {
  const p = spawnFrom(G.parts);
  p.type = type; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.max = life; p.size = size; p.color = color; p.grav = grav || 0; p.bounce = 0;
  return p;
}
function dust(x, y, n, col) { for (let i = 0; i < n; i++) part('dust', x + rand(-4, 4), y, rand(-40, 40), rand(-40, -5), rand(0.3, 0.6), randi(1, 2), col || '#d8b88a', 80); }
function smoke(x, y, n, col) { for (let i = 0; i < n; i++) part('smoke', x + rand(-3, 3), y + rand(-3, 3), rand(-15, 15), rand(-30, -8), rand(0.5, 1.1), rand(2, 4), col || '#c8c0b0', -10); }
function sparks(x, y, n, ang, col) {
  for (let i = 0; i < n; i++) { const a = ang + rand(-0.9, 0.9), s = rand(60, 220); part('spark', x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.1, 0.3), 1, col || '#ffd070', 400); }
}
function puffs(x, y, n, col, ang) {
  for (let i = 0; i < n; i++) { const a = (ang == null ? rand(0, TAU) : ang + rand(-0.8, 0.8)), s = rand(30, 120); part('dust', x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.2, 0.5), randi(1, 2), col, 300); }
}
function shell(x, y, f, col) { const p = part('shell', x, y, -f * rand(40, 90), rand(-160, -90), 2.2, 1, col || '#e0b040', 900); p.bounce = 1; }
function floatText(x, y, text, color, big) {
  if (!Store.settings.dmgNumbers && !big) return;
  const n = spawnFrom(G.nums);
  n.x = x + rand(-4, 4); n.y = y; n.vy = -40; n.life = big ? 1.1 : 0.7; n.max = n.life; n.text = text; n.color = color; n.big = !!big;
}
function shake(a) { G.trauma = Math.min(1, G.trauma + a); }
function light(x, y, r, life) { G.flashes.push({ x, y, r, life, max: life }); }

// ---------------- bullets ----------------
function fireBullet(team, x, y, ang, speed, dmg, opt) {
  const b = spawnFrom(G.bullets);
  b.team = team; b.x = x; b.y = y; b.px = x; b.py = y; b.sx = x; b.sy = y;
  b.vx = Math.cos(ang) * speed; b.vy = Math.sin(ang) * speed;
  b.dmg = dmg; b.dist = 0; b.range = opt.range || 600; b.pierce = opt.pierce || 0; b.wpn = opt.wpn || null;
  b.shot = opt.shot || 0; b.headMult = opt.headMult || 2; b.knock = opt.knock || 40; b.falloff = !!opt.falloff;
  b.crit = !!opt.crit; b.big = !!opt.big; b.weak = opt.weak || 0; b.age = 0; b.wagonDmg = opt.wagonDmg || 0.3;
  b.grav = opt.grav || 0; b.explosive = opt.explosive || 0; b.arrow = !!opt.arrow; b.knife = !!opt.knife; b.silent = !!opt.silent;
  b.hit = b.hit || []; b.hit.length = 0;
  b.ign = b.ign || []; b.ign.length = 0;
  for (const s of G.solids) if (COVER_KINDS.has(s.kind) && x > s.x - 28 && x < s.x + s.w + 28 && y < s.y + 6 && y > s.y - 40) b.ign.push(s);
  return b;
}

function hitTest(e, x0, y0, x1, y1) {
  const hh = e.headH || 10;
  const head = { x: e.x + 1, y: e.y, w: e.w - 2, h: hh };
  const body = { x: e.x, y: e.y + hh, w: e.w, h: e.h - hh };
  const th = segRect(x0, y0, x1, y1, head), tb = segRect(x0, y0, x1, y1, body);
  if (th < 0 && tb < 0) return null;
  if (th >= 0 && (tb < 0 || th <= tb + 0.0001)) return { t: th, head: true };
  return { t: tb, head: false };
}

// Lobbed charges burst wherever they stop.
function detonate(b, x, y) {
  b.dead = true; b.x = x; b.y = y;
  explode(x, y, b.explosive, 25, b.dmg, b.team === 'p');
}

function updateBullet(b, dt) {
  if (b.grav) b.vy += b.grav * dt;
  let x0 = b.x, y0 = b.y;
  const x1 = x0 + b.vx * dt, y1 = y0 + b.vy * dt;
  b.px = x0; b.py = y0; b.age += dt;
  for (let guard = 0; guard < 6; guard++) {
    let best = 2, bt = null, kind = null, head = false;
    for (const s of G.solids) {
      if (s.bullet === false || b.ign.includes(s)) continue;
      const t = segRect(x0, y0, x1, y1, s);
      if (t >= 0 && t < best) { best = t; bt = s; kind = 's'; }
    }
    if (b.team === 'p') {
      for (const e of G.enemies) {
        if (e.dead || e.invuln || b.hit.includes(e)) continue;
        if (Math.abs(cxOf(e) - x0) > Math.abs(x1 - x0) + 60) continue;
        const r = hitTest(e, x0, y0, x1, y1);
        if (r && r.t < best) { best = r.t; bt = e; kind = 'e'; head = r.head; }
      }
      for (const d of G.dyns) {
        if (d.dead) continue;
        const t = segRect(x0, y0, x1, y1, { x: d.x - 3, y: d.y - 3, w: 6, h: 6 });
        if (t >= 0 && t < best) { best = t; bt = d; kind = 'd'; }
      }
    } else {
      const P = G.player;
      if (P.alive && !b.hit.includes(P)) { const r = hitTest(P, x0, y0, x1, y1); if (r && r.t < best) { best = r.t; bt = P; kind = 'p'; } }
      const W = G.wagon;
      if (W && !W.dead) { const t = segRect(x0, y0, x1, y1, W); if (t >= 0 && t < best) { best = t; bt = W; kind = 'w'; } }
    }
    if (!bt) break;
    const hx = x0 + (x1 - x0) * best, hy = y0 + (y1 - y0) * best;
    b.dist += Math.hypot(hx - x0, hy - y0);
    if (b.explosive && (kind === 's' || kind === 'e' || kind === 'd')) { if (kind === 'd') bt.fuse = 0; detonate(b, hx - b.vx * 0.004, hy - b.vy * 0.004); return; }
    if (kind === 's') {
      bulletHitSolid(b, bt, hx, hy); b.x = hx; b.y = hy; b.dead = true;
      if (b.arrow && bt.kind !== 'bottle') { const p = part('stuck', hx, hy, b.vx, b.vy, 4, 1, '#a8784a', 0); p.vx = b.vx; p.vy = b.vy; }
      return;
    }
    if (kind === 'd') { bt.fuse = 0; bt.byPlayer = true; b.x = hx; b.y = hy; b.dead = true; return; }
    if (kind === 'p') {
      b.hit.push(bt);
      if (bt.hurt(b.dmg, b.sx)) { puffs(hx, hy, 4, '#8a2a20', Math.atan2(b.vy, b.vx)); b.x = hx; b.y = hy; b.dead = true; return; }
      x0 = hx; y0 = hy; continue; // dodged: bullet passes through
    }
    if (kind === 'w') { bt.hurt(b.dmg * b.wagonDmg); sparks(hx, hy, 3, Math.atan2(-b.vy, -b.vx), '#d8a060'); Sound.play('wood', { x: hx }); b.x = hx; b.y = hy; b.dead = true; return; }
    // enemy hit
    b.hit.push(bt);
    damageEnemy(bt, b, head, hx, hy);
    if (b.pierce > 0 && !bt.boss && !bt.armorT) { b.pierce--; b.dmg *= 0.8; x0 = hx; y0 = hy; continue; }
    b.x = hx; b.y = hy; b.dead = true; return;
  }
  b.dist += Math.hypot(x1 - x0, y1 - y0);
  b.x = x1; b.y = y1;
  if (b.dist > b.range || b.x < -50 || b.x > G.width + 50 || b.y > VH + 50 || b.y < -200) {
    if (b.explosive && b.y < VH) detonate(b, b.x, b.y); else b.dead = true;
  }
}

function bulletHitSolid(b, s, x, y) {
  const back = Math.atan2(-b.vy, -b.vx);
  const k = s.kind;
  if (k === 'crate' || k === 'boards' || k === 'door' || k === 'gate' || k === 'car' || k === 'wood' || k === 'cart' || k === 'hull' || k === 'pier' || k === 'coffin') { puffs(x, y, 4, '#b8844a', back); Sound.play('wood', { x }); }
  else if (k === 'bottle') { /* handled by damage */ }
  else if (k === 'rock' || k === 'ground') { puffs(x, y, 5, '#c8a07a', back); Sound.play('dirt', { x }); }
  else { sparks(x, y, 5, back); Sound.play('ric', { x }); }
  if (s.hp != null && !(s.kind === 'coffin' && b.team === 'e')) damageSolid(s, b.team === 'p' ? b.dmg : b.dmg * 0.5, b.team === 'p');
}

function damageSolid(s, dmg, byPlayer) {
  if (s.hp == null || s.broken) return;
  s.hp -= dmg; s.hurtT = 0.1;
  if (s.hp > 0) return;
  s.broken = true;
  G.removeSolid(s);
  if (s.onBreak) s.onBreak();
  const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
  if (s.kind === 'barrel') { s.pending = 0.12; G.pendingBlasts.push({ x: cx, y: cy, t: 0.12, byPlayer }); return; }
  if (s.kind === 'bottle') {
    Sound.play('glass', { x: cx });
    for (let i = 0; i < 8; i++) part('debris', cx, cy, rand(-80, 80), rand(-160, -40), rand(0.4, 0.8), 1, i % 2 ? '#7ab86a' : '#cfeac0', 600);
    if (byPlayer) G.counters.bottle = (G.counters.bottle || 0) + 1;
    return;
  }
  Sound.play('crate', { x: cx });
  for (let i = 0; i < 14; i++) part('debris', cx + rand(-s.w / 2, s.w / 2), cy + rand(-s.h / 2, s.h / 2), rand(-120, 120), rand(-220, -60), rand(0.5, 1), randi(1, 2), i % 3 ? '#a8743a' : '#6a4220', 700).bounce = 1;
  smoke(cx, cy, 4, '#c8a878');
  if (s.kind === 'crate' && Math.random() < 0.3) G.dropPickup(Math.random() < 0.6 ? 'cash' : 'ammo', cx, cy, 6);
  if (s.secret && byPlayer) { G.toast('Secret found!'); Sound.play('gold'); }
}

function damageEnemy(e, b, head, hx, hy) {
  const P = G.player, st = G.pstats;
  let dmg = b.dmg;
  if (b.falloff) dmg *= clamp(1 - (b.dist - 50) / 260, 0.3, 1);
  let crit = b.crit;
  if (head) {
    dmg *= e.boss ? Math.min(b.headMult, 1.6) : b.headMult;
    if (P.deActive) crit = true;
  }
  if (!crit && Math.random() < st.critChance) crit = true;
  if (crit) dmg *= st.critMult;
  let weak = false;
  if (e.armorT && !head) {
    // Iron Jack's back tank: shots travelling the same way he faces hit his back.
    if (e.tankWeak && Math.sign(b.vx) === e.f) { dmg *= 2.2; weak = true; }
    else dmg *= e.armorFactor();
  }
  const kx = Math.sign(b.vx) * b.knock;
  e.hurt(dmg, { head, crit, kx, byPlayer: true, x: hx, y: hy, weak, silent: b.silent });
  if (!G.hitShots.has(b.shot)) { G.hitShots.add(b.shot); G.stats.hits++; }
  P.addDE(head ? 8 : 3);
  const back = Math.atan2(-b.vy, -b.vx);
  if (e.armorT && !head && !weak) { sparks(hx, hy, 5, back, '#ffe0a0'); Sound.play('ric', { x: hx }); }
  else puffs(hx, hy, head ? 7 : 4, e.decoy ? '#e8e8e0' : '#8a2a20', back + Math.PI);
  G.hitmarker = head ? 0.25 : 0.15; G.hitHead = head;
  Sound.play(head ? 'headshot' : 'hitmarker');
  if (crit && P.deActive) { Sound.play('crit'); light(hx, hy, 30, 0.15); }
  if (head) G.stats.headshots++;
  const txt = Math.round(dmg) + '';
  floatText(hx, hy - 6, weak ? 'WEAK ' + txt : head ? (crit ? 'CRIT ' : '') + txt : txt, weak ? '#ffa040' : head ? (crit ? '#ffe040' : '#ff6a4a') : crit ? '#ffe040' : '#ffffff');
}

// ---------------- explosions ----------------
function explode(x, y, r, dmgP, dmgE, byPlayer) {
  Sound.play('explosion', { x });
  shake(0.55);
  light(x, y, r * 2.2, 0.35);
  part('ring', x, y, 0, 0, 0.3, r, '#fff0c0');
  for (let i = 0; i < 18; i++) { const a = rand(0, TAU), s = rand(20, 160); part('fire', x, y, Math.cos(a) * s, Math.sin(a) * s - 30, rand(0.25, 0.55), rand(3, 6), choose(['#ffd060', '#ff9a30', '#ff6a20']), -40); }
  smoke(x, y - 4, 10, '#5a4a40');
  for (let i = 0; i < 10; i++) part('debris', x, y, rand(-160, 160), rand(-260, -80), rand(0.5, 1), 1, '#4a3020', 700).bounce = 1;
  for (const e of G.enemies) {
    if (e.dead || e.invuln) continue;
    const d = Math.hypot(cxOf(e) - x, e.y + e.h / 2 - y);
    if (d < r + e.w / 2) {
      let dmg = dmgE * clamp(1 - d / (r * 1.5), 0.35, 1);
      if (e.boss) dmg *= 0.5;
      e.hurt(dmg, { kx: Math.sign(cxOf(e) - x) * 220, byPlayer, explosion: true });
      e.vy -= 160;
      if (byPlayer) floatText(cxOf(e), e.y, Math.round(dmg) + '', '#ffb040');
    }
  }
  const P = G.player;
  if (P.alive) {
    const d = Math.hypot(cxOf(P) - x, P.y + P.h / 2 - y);
    if (d < r + 4 && P.hurt(dmgP * clamp(1 - d / (r * 1.6), 0.4, 1), x)) { P.vx += Math.sign(cxOf(P) - x) * 220; P.vy = -220; }
  }
  if (G.wagon && !G.wagon.dead && Math.hypot(cxOf(G.wagon) - x, G.wagon.y + 20 - y) < r + 30) G.wagon.hurt(dmgP * 1.2);
  for (const s of G.solids.slice()) {
    if (s.hp == null || s.broken) continue;
    if (Math.hypot(s.x + s.w / 2 - x, s.y + s.h / 2 - y) < r + Math.max(s.w, s.h) / 2) damageSolid(s, s.kind === 'barrel' ? 999 : 120, byPlayer);
  }
}

// Thrown dynamite (enemies & bosses). Shoot it to detonate early.
function throwDynamite(x, y, tx, ty, flight, fuse) {
  const T = flight;
  const d = { x, y, vx: (tx - x) / T, vy: (ty - y - 0.5 * GRAV * T * T) / T, fuse, landed: false, dead: false, t: 0, byPlayer: false, w: 4, h: 4, tx, ty };
  G.dyns.push(d);
  Sound.play('throw', { x });
  return d;
}
function updateDynamite(d, dt) {
  d.t += dt; d.fuse -= dt;
  if ((d.t * 10 | 0) % 2) part('spark', d.x, d.y - 3, rand(-30, 30), rand(-60, -20), 0.15, 1, '#ffe060', 0);
  if (!d.landed) {
    d.vy += GRAV * dt;
    const nx = d.x + d.vx * dt, ny = d.y + d.vy * dt;
    const s = pointSolid(nx, ny);
    if (s && d.vy > 0) { d.landed = true; d.y = s.y - 2; d.vx = 0; d.vy = 0; Sound.play('wood', { x: d.x }); }
    else if (pointSolid(nx, d.y)) { d.vx *= -0.3; }
    else { d.x = nx; d.y = ny; }
    if (d.y > VH + 30) d.dead = true;
  }
  if (d.fuse <= 0 && !d.dead) { d.dead = true; explode(d.x, d.y, 50, 34 * G.diff.edmg, 130, d.byPlayer); }
}

// ---------------- player ----------------
class Player {
  constructor(x, y) {
    const st = G.pstats;
    this.w = 12; this.h = 30; this.H = 30; this.HC = 19; this.headH = 10;
    this.x = x - 6; this.y = y - 30; this.vx = 0; this.vy = 0; this.f = 1;
    this.onGround = false; this.crouch = false; this.alive = true; this.deadT = 0;
    this.hp = this.maxHp = st.maxHp;
    this.rollT = 0; this.rollCd = 0; this.rollDir = 1; this.iframes = 0; this.airRoll = false; this.flashT = 0;
    this.coyote = 0; this.jumpBuf = 0; this.stepT = 0; this.phase = 0; this.t = 0;
    this.slots = Store.save.loadout.slice();
    this.ammo = {};
    for (const id of this.slots) if (id) { const ws = st.weapons[id]; this.ammo[id] = { mag: ws.mag, reserve: ws.startReserve }; }
    this.cur = this.slots.findIndex(Boolean);
    this.fireT = 0; this.reloadT = 0; this.swapT = 0; this.heat = 0; this.drawT = 0; this.spin = 0; this.spinT = 0; this.burstLeft = 0; this.burstT = 0; this.dualSide = 0; this.recoil = 0; this.recoil2 = 0; this.leverT = 0; this.queued = 0;
    this.de = st.deCap * 0.5; this.deActive = false; this.forcedDE = false; this.beatT = 0;
    this.aim = 0; this.aimX = x + 100; this.aimY = y - 20; this.ads = false;
    this.lastSafe = { x: this.x, y: this.y }; this.safeT = 0;
    this.dropT = 0; this.muzzle = null;
  }
  get wid() { return this.slots[this.cur]; }
  get ws() { return G.pstats.weapons[this.wid]; }
  get cx() { return this.x + this.w / 2; }
  shoulder() {
    const fe = this.y + this.h;
    return { x: this.cx + this.f * 3, y: fe - (this.crouch ? 10 : 19) };
  }
  addDE(v) { if (!this.forcedDE) this.de = Math.min(G.pstats.deCap, this.de + v * G.pstats.deRegen); }
  setDE(on) {
    if (on === this.deActive) return;
    this.deActive = on;
    Sound.play(on ? 'deOn' : 'deOff'); Sound.setDeadEye(on);
    if (on) this.beatT = 0;
  }
  switchTo(i) {
    if (i === this.cur || !this.slots[i] || this.rollT > 0) return;
    this.cur = i; this.reloadT = 0; this.swapT = this.ws.swap; this.heat = 0; this.fireT = 0; this.drawT = 0; this.spin = 0; this.burstLeft = 0;
    Sound.play('swap');
  }
  cycle(d) {
    for (let k = 1; k <= 4; k++) { const i = (this.cur + d * k + 8) % 4; if (this.slots[i]) { this.switchTo(i); return; } }
  }
  startReload() {
    const a = this.ammo[this.wid], ws = this.ws;
    if (this.reloadT > 0 || a.mag >= ws.mag || a.reserve <= 0) return;
    this.reloadT = ws.reload; this.reloadMax = ws.reload;
    Sound.play('reload');
    if (this.wid === 'revolver' || this.wid === 'devil' || this.wid === 'dual') { const sh = this.shoulder(); for (let i = 0; i < Math.min(6, ws.mag - a.mag); i++) shell(sh.x, sh.y + 2, -this.f); }
  }
  finishReload() {
    const a = this.ammo[this.wid], n = Math.min(this.ws.mag - a.mag, a.reserve);
    a.mag += n; if (a.reserve !== Infinity) a.reserve -= n;
    Sound.play('reloadEnd');
    if (this.wid === 'shotgun') Sound.play('pump');
  }
  hurt(dmg, srcX, opt) {
    if (!this.alive || G.state !== 'play') return false;
    if (this.rollT > 0) { // dodge roll: projectile passes through
      if (!(this._dodgeMsg > 0)) { floatText(this.cx, this.y - 4, 'DODGE', '#a0d8ff', true); this._dodgeMsg = 0.6; }
      return false;
    }
    if (this.iframes > 0) return true; // brief mercy window after a hit: absorbed, no damage
    dmg *= G.pstats.resist;
    this.hp -= dmg; this.iframes = 0.32; this.flashT = 0.1;
    G.stats.dmgTaken += dmg; G.hurtFlash = 0.35;
    shake(0.22 + dmg / 120);
    Sound.play('hurt');
    if (srcX != null) this.vx += Math.sign(this.cx - srcX || 1) * 70;
    if (this.hp <= 0) this.die();
    return true;
  }
  heal(v) { const before = this.hp; this.hp = Math.min(this.maxHp, this.hp + v * G.pstats.heal); return this.hp > before; }
  die() {
    this.hp = 0; this.alive = false; this.deadT = 0; this.vy = -180; this.vx = -this.f * 60;
    this.setDE(false); this.forcedDE = false;
    Sound.play('enemyDie');
    G.onPlayerDeath();
  }

  update(dt) {
    const st = G.pstats;
    this.t += dt;
    if (this._dodgeMsg > 0) this._dodgeMsg -= dt;
    if (!this.alive) { this.deadT += dt; this.vx *= 0.92; physics(this, dt); return; }
    // Dead Eye meter (real time)
    if (Input.hit('deadeye') && !this.forcedDE) {
      if (this.deActive) this.setDE(false);
      else if (this.de >= 20) this.setDE(true);
      else { Sound.play('deny'); floatText(this.cx, this.y - 6, 'DEAD EYE LOW', '#ffd070', true); }
    }

          if (this.shots <= 0) { this.atk = 'cool'; this.atkT = rand(T.cool[0], T.cool[1]) * G.diff.react; }

  }

  shoot(ang) {
    const T = this.T, sh = this.shoulder(), sp = (T.spread || 0.05) * G.diff.spread;
    const n = T.pellets || 1;
    for (let i = 0; i < n; i++) {
      const a = ang + (n > 1 ? (i / (n - 1) - 0.5) * sp * 2 : rand(-sp, sp));
      fireBullet('e', sh.x, sh.y, a, T.bspeed, T.dmg * G.diff.edmg, { range: T.brange || T.range + 160, big: T.gun === 'rifle', knife: T.gun === 'knife' });
    }
    if (T.gun === 'knife') { Sound.play('throw', { x: this.cx }); this.recoil = 2; return; }
    const len = T.gun === 'rifle' ? 20 : T.gun === 'gatling' ? 18 : 14;
    part('flash', sh.x + Math.cos(ang) * len, sh.y + Math.sin(ang) * len, 0, 0, 0.06, n > 1 ? 5 : 4, '#ffd8a0');
    light(sh.x + Math.cos(ang) * len, sh.y + Math.sin(ang) * len, 60, 0.08);
    this.recoil = 2;

  hurt(dmg, info) {

  }

  kill(info) {
    if (this.dead) return;
    this.dead = true; this.deadT = 0; this.hp = 0;
    if (this.crouch) { setHeight(this, this.H); this.crouch = false; }
    this.vy = -140; this.vx = (info && info.kx) ? Math.sign(info.kx) * 90 : 0;
    this.f = this.vx ? -Math.sign(this.vx) : this.f;
    Sound.play('enemyDie', { x: this.cx });

  }

  draw(c, t) {
    if (this.remove) return;
    const alpha = this.spawnT > 0 ? 1 - this.spawnT / 0.45 : this.dead && this.deadT > 2.5 ? Math.max(0, 1 - (this.deadT - 2.5)) : 1;
    if (alpha <= 0) return;

    const fx = this.cx, fy = this.y + this.h;
    if (!this.dead) { c.fillStyle = 'rgba(40,20,10,0.25)'; c.fillRect(Math.round(fx - this.w / 2 - 1), Math.round(fy), this.w + 2, 1); }
    const state = this.dead ? 'dead' : this.rollT > 0 ? 'roll' : this.crouch ? 'crouch' : !this.onGround ? 'jump' : Math.abs(this.vx) > 10 ? 'run' : 'idle';
    let gun = this.gun === 'dynamite' ? (this.atk === 'aim' ? 'dynamite' : null) : this.gun === 'knife' ? (this.atk !== 'cool' ? 'knife' : null) : this.gun;
    let aim = this.aimAng;
    if (gun && (this.atk === 'cool' && this.crouch)) aim = this.f > 0 ? 0.7 : Math.PI - 0.7;
    drawCharacter(c, this.L, fx, fy, { f: this.f, state, phase: this.phase, aim, gun, flash: this.flash > 0, t, deadT: this.deadT, recoil: this.recoil > 0 ? 1 : 0 });
    if (this.recoil > 0) this.recoil -= 0.25;
    c.globalAlpha = 1;
  }
}

// ---------------- bosses ----------------
class Boss extends Enemy {
  constructor(id, x, feetY) {
    const B = BOSSES[id];
    super('boss', x, feetY, { look: B.look, spawnT: 0 });
    this.id = id; this.B = B; this.boss = true; this.name = B.name;
    this.maxHp = this.hp = B.hp * G.diff.bhp;
    this.headH = 12; this.introT = 2.4; this.state = 'intro'; this.st = 0; this.alert = true;
    this.gun = B.gun; this.aimAng = Math.PI; this.p2 = false;
    this.T = { speed: 60, gun: B.gun, cool: [1, 2], burst: [1, 1] };
  }
  hurt(dmg, info) {
    if (this.introT > 0 || this.state === 'intro') return;
    if (this.stunT > 0) dmg *= 1.5;
    const before = this.hp;
    super.hurt(dmg, info);
    if (this.hp > 0 && before - this.hp > 0) { if (Math.random() < 0.3) Sound.play('bossHurt', { x: this.cx }); }
  }
  update(dt) {
    this.t += dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.dead) { this.deadT += dt; this.vx *= Math.pow(0.02, dt); physics(this, dt); return; }
    if (this.introT > 0) {
      this.introT -= dt; this.f = Math.sign(G.player.cx - this.cx) || -1;
      this.aimAng = this.f > 0 ? 0.4 : Math.PI - 0.4;
      physics(this, dt);
      if (this.introT <= 0) { this.state = 'idle'; this.st = 0.4; }
      return;
    }
    if (this.stunT > 0) this.stunT -= dt;
    if (G.player.alive) this.think(dt);
    else this.vx = approach(this.vx, 0, 600 * dt);
    physics(this, dt);
    if (Math.abs(this.vx) > 10 && this.onGround) this.phase = (this.phase + dt * Math.abs(this.vx) / 60) % 1;
    if (this.y > VH + 30) { this.y = 100; this.x = (G.arena.x0 + G.arena.x1) / 2; } // never lose a boss in a pit
  }
  aimAt(dt, rate) {
    const P = G.player, sh = this.shoulder();
    const ang = Math.atan2(P.y + 10 - sh.y, P.cx - sh.x);
    this.aimAng += angDiff(this.aimAng, ang) * Math.min(1, dt * (rate || 10));
    return ang;
  }
  blast(n, spread, dmg, speed, range, ang) {
    const sh = this.shoulder();
    for (let i = 0; i < n; i++) fireBullet('e', sh.x, sh.y, ang + (i / (n - 1) - 0.5) * spread * 2 + rand(-0.02, 0.02), speed, dmg * G.diff.edmg, { range });
    part('flash', sh.x + Math.cos(ang) * 16, sh.y + Math.sin(ang) * 16, 0, 0, 0.08, 6, '#ffd8a0');
    light(sh.x, sh.y, 80, 0.1); shake(0.15);
    Sound.play('eshotgun', { x: this.cx });
  }
  single(ang, dmg, speed, snd) {
    const sh = this.shoulder();
    fireBullet('e', sh.x, sh.y, ang, speed, dmg * G.diff.edmg, { range: 900, big: true });
    part('flash', sh.x + Math.cos(ang) * 16, sh.y + Math.sin(ang) * 16, 0, 0, 0.06, 5, '#ffd8a0');
    light(sh.x, sh.y, 70, 0.08);
    Sound.play(snd || 'erifle', { x: this.cx });
  }
  walkTo(x, sp, dt) { const d = x - this.cx; this.vx = approach(this.vx, Math.abs(d) > 6 ? Math.sign(d) * sp : 0, 900 * dt); return Math.abs(d) <= 6; }
  draw(c, t) {
    if (this.hidden) return;
    const fx = this.cx, fy = this.y + this.h;
    let alpha = this.alpha == null ? 1 : this.alpha;
    if (this.dead && this.deadT > 3) alpha = Math.max(0, 1 - (this.deadT - 3));
    c.globalAlpha = alpha;
    if (!this.dead && !this.decoy) { c.fillStyle = 'rgba(40,20,10,0.3)'; c.fillRect(Math.round(fx - this.w / 2 - 2), Math.round(fy), this.w + 4, 1); }
    const state = this.dead ? 'dead' : this.rolling ? 'roll' : this.crouch ? 'crouch' : !this.onGround ? 'jump' : Math.abs(this.vx) > 10 ? 'run' : 'idle';
    const tell = this.tell > 0 && (t * 16 | 0) % 2;
    drawCharacter(c, this.L, fx, fy, { f: this.f, state, phase: this.phase, aim: this.aimAng, gun: this.gun, flash: this.flash > 0 || tell, t, deadT: this.deadT, recoil: 0, skin: this.id === 'devil' ? DEVIL_SKIN : null, dual: this.dualGuns, phaseRoll: this.phase });
    c.globalAlpha = 1;
    if (this.stunT > 0 && !this.dead) for (let i = 0; i < 3; i++) { const a = t * 6 + i * TAU / 3; px(c, Math.round(fx + Math.cos(a) * 8), Math.round(this.y - 4 + Math.sin(a) * 2), 2, 2, '#ffe060'); }
  }
}

class Butcher extends Boss {
  constructor(x, y) { super('butcher', x, y); this.headH = 12; this.cd = 0; }
  next() {
    const P = G.player, adx = Math.abs(P.cx - this.cx), r = Math.random();
    const crates = G.solids.filter(s => s.kind === 'crate' && !s.broken);
    if (!this.p2 && r < 0.22 && crates.length && this.lastState !== 'cover') {
      const side = Math.sign(this.cx - P.cx) || 1;
      let best = null, bd = 1e9;
      for (const s of crates) { const sx = side > 0 ? s.x + s.w + this.w / 2 + 1 : s.x - this.w / 2 - 1; const d = Math.abs(sx - this.cx); if (Math.sign(s.x + s.w / 2 - P.cx) === side && d < bd && d < 260) { bd = d; best = sx; } }
      if (best != null) { this.state = 'cover'; this.goalX = best; this.st = 4; this.lastState = 'cover'; return; }
    }
    if (adx < 170 ? r < 0.6 : r < 0.3) { this.state = 'pump'; this.st = this.p2 ? 0.38 : 0.55; this.blasts = this.p2 ? 2 : 1; this.tell = this.st; Sound.play('pump', { x: this.cx }); }
    else if (r < 0.85) { this.state = 'chargeTell'; this.st = this.p2 ? 0.55 : 0.8; this.tell = this.st; Sound.play('stomp', { x: this.cx }); }
    else { this.state = 'walk'; this.st = 1.1; }
    this.lastState = this.state;
  }
  think(dt) {
    const P = G.player, dx = P.cx - this.cx;
    if (this.tell > 0) this.tell -= dt;
    if (!this.p2 && this.hp < this.maxHp * 0.5) {
      this.p2 = true; this.state = 'roar'; this.st = 1.1; this.crouch = false; setHeight(this, this.H);
      Sound.play('roar', { x: this.cx }); shake(0.6); G.banner('THE BUTCHER IS ENRAGED', 'He charges faster and blasts twice');
      this.L = Object.assign({}, this.L, { shirt: '#c86a5a' });
    }
    const sp = this.p2 ? 1.3 : 1;
    this.st -= dt;
    switch (this.state) {
      case 'idle': this.vx = approach(this.vx, 0, 800 * dt); this.aimAt(dt); if (this.st <= 0) this.next(); break;
      case 'roar': this.vx = 0; if ((this.t * 20 | 0) % 3 === 0) dust(this.cx + rand(-10, 10), this.y + this.h, 1); if (this.st <= 0) this.next(); break;
      case 'walk': this.f = Math.sign(dx) || 1; this.aimAt(dt); this.vx = approach(this.vx, Math.abs(dx) > 90 ? Math.sign(dx) * 70 * sp : 0, 800 * dt); if (this.st <= 0) this.next(); break;
      case 'pump': {
        this.vx = approach(this.vx, 0, 900 * dt); this.f = Math.sign(dx) || 1;
        const ang = this.aimAt(dt, 8);
        if (this.st <= 0) {
          this.blast(7, 0.32, 8, 470, 320, ang); this.blasts--;
          if (this.blasts > 0) { this.st = 0.4; this.tell = 0.3; Sound.play('pump', { x: this.cx }); } else { this.state = 'idle'; this.st = this.p2 ? 0.45 : 0.8; }
        }
        break;
      }
      case 'chargeTell':
        this.vx = 0; this.f = Math.sign(dx) || 1; this.aimAt(dt);
        if ((this.t * 30 | 0) % 4 === 0) dust(this.cx - this.f * 8, this.y + this.h, 1);
        if (this.st <= 0) { this.state = 'charge'; this.st = 1.7; this.chargeDir = this.f; this.chargeHit = false; Sound.play('roar', { x: this.cx }); }
        break;
      case 'charge':
        this.f = this.chargeDir; this.vx = this.chargeDir * 330 * sp;
        if ((this.t * 30 | 0) % 2 === 0) dust(this.cx - this.f * 8, this.y + this.h, 1);
        if (!this.chargeHit && P.alive && overlap(this, P)) {
          if (P.hurt(28 * G.diff.edmg, this.cx)) { P.vx = this.chargeDir * 380; P.vy = -260; this.chargeHit = true; }
        }
        if (this.hitWall) {
          const s = this.hitSolid;
          if (s && s.kind === 'crate') { damageSolid(s, 999, false); this.stunT = 1.2; }
          else this.stunT = 1.0;
          shake(0.5); Sound.play('stomp', { x: this.cx }); dust(this.cx + this.f * 10, this.y + this.h - 10, 8, '#b8844a');
          this.state = 'stun'; this.st = this.stunT; this.vx = -this.chargeDir * 60;
        } else if (this.st <= 0) { this.state = 'idle'; this.st = 0.6; }
        break;
      case 'stun': this.vx = approach(this.vx, 0, 600 * dt); if (this.st <= 0) { this.stunT = 0; this.state = 'idle'; this.st = 0.3; } break;
      case 'cover': {
        this.aimAt(dt);
        const there = this.walkTo(this.goalX, 90, dt);
        if (there && !this.crouch) { if (setHeight(this, this.HC)) { this.crouch = true; this.st = Math.min(this.st, 1.5); } }
        if (this.st <= 0 || (this.crouch && !G.solids.some(s => s.kind === 'crate' && Math.abs(s.x + s.w / 2 - this.cx) < 30))) {
          if (this.crouch) { setHeight(this, this.H); this.crouch = false; }
          this.state = 'pump'; this.st = 0.45; this.blasts = 1; this.tell = 0.45; Sound.play('pump', { x: this.cx });
        }
        break;
      }
    }
  }
}

class Ghost extends Boss {
  constructor(x, y) { super('ghost', x, y); this.cycle = 0; this.dmgSince = 0; this.alpha = 1; this.laser = 0; }
  hurt(dmg, info) {
    if (this.hidden || this.state === 'vanish') return;
    const before = this.hp; super.hurt(dmg, info);
    this.dmgSince += before - this.hp;
    if (!this.dead && this.dmgSince > this.maxHp * 0.13 && this.state !== 'vanish') this.vanish();
  }
  vanish() {
    this.state = 'vanish'; this.st = 0.35; this.laser = 0;
    smoke(this.cx, this.y + 15, 10, '#d8d8d0'); Sound.play('laugh', { x: this.cx });
  }
  think(dt) {
    const P = G.player;
    if (!this.p2 && this.hp < this.maxHp * 0.5) { this.p2 = true; G.darkBoost = 0.08; G.banner('THE LANTERNS GUTTER', 'The Ghost fires twice'); }
    this.st -= dt; this.vx = 0;
    switch (this.state) {
      case 'idle': this.hidden = false; this.alpha = 1; this.aimAt(dt); if (this.st <= 0) { this.state = 'aim'; this.st = this.p2 ? 0.95 : 1.25; this.shotsLeft = this.p2 ? 2 : 1; } break;
      case 'appear':
        this.alpha = 1 - this.st / 0.4; this.aimAt(dt);
        if (this.st <= 0) { this.alpha = 1; this.state = 'aim'; this.st = this.p2 ? 0.95 : 1.25; this.shotsLeft = this.p2 ? 2 : 1; this.dmgSince = 0; }
        break;
      case 'aim': {
        this.f = Math.sign(P.cx - this.cx) || 1;
        if (this.st > 0.25) { this.lockAng = this.aimAt(dt, 14); this.laser = 1; }
        else { if (this.laser === 1) Sound.play('lock', { x: this.cx }); this.laser = 2; }
        if (this.st <= 0) {
          this.single(this.lockAng, 26, 1350, 'erifle'); this.shotsLeft--; this.laser = 0;
          if (this.shotsLeft > 0) { this.st = 0.55; } else { this.state = 'linger'; this.st = 0.5; }
        }
        break;
      }
      case 'linger': this.aimAt(dt); if (this.st <= 0) this.vanish(); break;
      case 'vanish':
        this.alpha = Math.max(0, this.st / 0.35);
        if (this.st <= 0) { this.hidden = true; this.invuln = true; this.state = 'hidden'; this.st = this.p2 ? 0.45 : 0.7; }
        break;
      case 'hidden':
        if (this.st <= 0) {
          const onScreen = p => p.x > G.cam.x + 24 && p.x < G.cam.x + VW - 24; // always appear where the player can see
          const all = G.level.perches || [];
          const perches = all.filter(onScreen).length >= 3 ? all.filter(onScreen) : all;
          const opts = perches.filter(p => Math.abs(p.x - this.cx) > 30 && Math.abs(p.x - P.cx) > 110);
          const pick = choose(opts.length ? opts : perches);
          this.x = pick.x - this.w / 2; this.y = pick.y - this.h; this.vy = 0;
          this.hidden = false; this.invuln = false; this.state = 'appear'; this.st = 0.4; this.alpha = 0;
          smoke(this.cx, this.y + 15, 8, '#d8d8d0');
          this.cycle++;
          if (Math.random() < (this.p2 ? 0.75 : 0.45) && this.cycle > 1) {
            const others = perches.filter(p => p !== pick && Math.abs(p.x - P.cx) > 80);
            for (let i = 0; i < 2 && others.length; i++) {
              const o = others.splice(randi(0, others.length - 1), 1)[0];
              G.enemies.push(new GhostDecoy(o.x, o.y));
            }
          }
        }
        break;
    }
  }
  draw(c, t) {
    super.draw(c, t);
    if (!this.hidden && this.laser) drawLaser(c, this.shoulder(), this.lockAng, this.laser === 2, t);
  }
}

class GhostDecoy extends Enemy {
  constructor(x, y) {
    super('sharp', x, y, { look: 'ghost', spawnT: 0.4 });
    this.decoy = true; this.hp = this.maxHp = 1; this.st = rand(1.1, 1.5); this.alert = true; this.lockAng = 0; this.laser = 1;
  }
  update(dt) {
    this.t += dt;
    if (this.dead) { this.remove = true; return; }
    if (this.spawnT > 0) { this.spawnT -= dt; return; }
    const P = G.player, sh = this.shoulder();
    this.f = Math.sign(P.cx - this.cx) || 1;
    this.st -= dt;
    if (this.st > 0.25) { this.lockAng = Math.atan2(P.y + 10 - sh.y, P.cx - sh.x); this.aimAng = this.lockAng; } else this.laser = 2;
    if (this.st <= 0) {
      fireBullet('e', sh.x, sh.y, this.lockAng, 1100, 7 * G.diff.edmg, { range: 900, big: true });
      Sound.play('eshot', { x: this.cx });
      smoke(this.cx, this.y + 15, 8, '#d8d8d0'); this.remove = true;
    }
  }
  kill() { this.dead = true; smoke(this.cx, this.y + 15, 10, '#d8d8d0'); Sound.play('laugh', { x: this.cx }); floatText(this.cx, this.y, 'DECOY', '#d8d8ff', true); }
  draw(c, t) {

    drawCharacter(c, this.L, this.cx, this.y + this.h, { f: this.f, state: 'idle', aim: this.aimAng, gun: 'rifle', t });
    c.globalAlpha = 1;
    if (this.spawnT <= 0) drawLaser(c, this.shoulder(), this.lockAng, this.laser === 2, t);
  }

function drawLaser(c, sh, ang, locked, t) {
  const len = 700;
  c.globalAlpha = locked ? 0.95 : 0.45 + Math.sin(t * 20) * 0.1;
  c.strokeStyle = locked ? '#ffffff' : '#ff3030';
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(sh.x + 0.5, sh.y + 0.5);
  // stop the laser at the first wall so it reads honestly
  let ex = sh.x + Math.cos(ang) * len, ey = sh.y + Math.sin(ang) * len, best = 1;
  for (const s of G.solids) { if (s.bullet === false) continue; const tt = segRect(sh.x, sh.y, ex, ey, s); if (tt > 0.02 && tt < best) best = tt; }
  c.lineTo(sh.x + (ex - sh.x) * best + 0.5, sh.y + (ey - sh.y) * best + 0.5);
  c.stroke();
  c.globalAlpha = 1;
}

class IronJack extends Boss {
  constructor(x, y) {
    super('ironjack', x, y);
    this.armorT = 1; this.tankWeak = true; this.headH = 11; this.turnT = 0;
  }
  armorFactor() { return Math.min(1, (this.p2 ? 0.5 : 0.25) + Store.up('ap') * 0.1); }
  next() {
    const P = G.player, adx = Math.abs(P.cx - this.cx), r = Math.random();
    if (r < 0.5) { this.state = 'suppressTell'; this.st = this.p2 ? 0.45 : 0.65; this.tell = this.st; Sound.play('lock', { x: this.cx }); }
    else if (r < 0.8 || adx > 260) { this.state = 'throwTell'; this.st = 0.45; this.tell = 0.45; }
    else { this.state = 'walk'; this.st = 1.3; }
  }
  think(dt) {
    const P = G.player, dx = P.cx - this.cx;
    if (this.tell > 0) this.tell -= dt;
    if (!this.p2 && this.hp < this.maxHp * 0.5) {
      this.p2 = true; G.banner('ARMOR CRACKED', 'Iron Jack is exposed — and furious');
      this.L = Object.assign({}, this.L, { armor: '#5a3e38', armorHi: '#c8603a' });
      this.state = 'vent'; this.st = 1.0; Sound.play('steam', { x: this.cx });
    }
    // slow turning: the tank on his back is exposed while he turns
    const want = Math.sign(dx) || this.f;
    if (want !== this.f) { this.turnT += dt; if (this.turnT > (this.p2 ? 0.45 : 0.75)) { this.f = want; this.turnT = 0; } } else this.turnT = 0;
    this.st -= dt;
    const ang = (() => { const sh = this.shoulder(); return Math.atan2(P.y + 10 - sh.y, P.cx - sh.x); })();
    const facingOk = Math.sign(dx) === this.f;
    if (facingOk) this.aimAng += angDiff(this.aimAng, ang) * Math.min(1, dt * 8);
    switch (this.state) {
      case 'idle': this.vx = approach(this.vx, 0, 600 * dt); if (this.st <= 0) this.next(); break;
      case 'walk': this.vx = approach(this.vx, Math.abs(dx) > 170 ? this.f * 45 : Math.abs(dx) < 100 ? -this.f * 30 : 0, 600 * dt); if (this.st <= 0) this.next(); break;
      case 'suppressTell': this.vx = 0; if (this.st <= 0) { this.state = 'suppress'; this.shots = this.p2 ? 16 : 12; this.fireT = 0; this.sweep = 0.28; } break;
      case 'suppress':
        this.fireT -= dt;

    }

    if (h.state === 'hiss' && Math.random() < dt * 20) part('smoke', h.x + rand(-3, 3), h.y, rand(-5, 5), rand(-40, -20), 0.4, 1, '#f0f0f0', 0);
    if (h.state === 'blast') {
      if (!h.sounded) { h.sounded = true; Sound.play('steam', { x: h.x }); }
      if (Math.random() < dt * 60) part('smoke', h.x + rand(-6, 6), h.y, rand(-10, 10), rand(-260, -160), 0.45, rand(2, 4), '#f4f4f4', 0);
      const col = { x: h.x - 8, y: h.y - 90, w: 16, h: 90 };
      if (P.alive && overlap(P, col) && !h.hitDone) { if (P.hurt(14 * G.diff.edmg, h.x)) { P.vy = -300; h.hitDone = true; } }
      for (const e of G.enemies) if (!e.dead && !e.boss && overlap(e, col)) e.hurt(40 * dt, { kx: 0 });
    } else { h.sounded = false; h.hitDone = false; }
  } else if (h.type === 'fire') {

          for (const e of this.enemies) {
            if (e.dead || e.invuln || e.hidden || Math.abs(e.cx - P.cx) > 520) continue;
            const ty = e.y + (mode === 'high' ? 4 : 14), ea = Math.atan2(ty - sh.y, e.cx - sh.x), d = Math.abs(angDiff(a, ea));
            if (d < bd && losClear(sh.x, sh.y, e.cx, ty)) { bd = d; best = ea; }
          }

  update(dt) {
    const P = this.player;
    if (this.slowmo > 0) this.slowmo -= dt;
    let ts = this.showdown && this.showdown.t > 1.8 ? 0.25 : P.deActive ? this.pstats.deSlow : 1;
    if (this.slowmo > 0) ts = Math.min(ts, 0.35);
    if (this.state === 'complete') ts = 0.6;
    this.ts = ts;
    const wdt = dt * ts;
    this.time += wdt; this.run.time += dt;
    this.computeAim();
    if (this.state === 'play' || this.state === 'dead') P.update(dt);
    if (this.state !== 'play') { this.endT += dt; }
    // showdown choreography
    if (this.showdown) {
      const sd = this.showdown; sd.t += dt;
      if (sd.t > 1.8 && sd.boss.state === 'showIntro') {
        sd.boss.state = 'duel'; sd.boss.invuln = false; sd.boss.st = 1.0;
        P.de = this.pstats.deCap; P.forcedDE = true; P.setDE(true);
        this.banner('DRAW!', 'Three hits, or one to the head', 1.6);
        Sound.play('bell');
      }
    }
    // world-time scheduler
    for (let i = this.timers.length - 1; i >= 0; i--) { const tm = this.timers[i]; tm.t -= wdt; if (tm.t <= 0) { this.timers.splice(i, 1); tm.fn(); } }
    // waves
    for (const w of this.waves) {
      if (!w.fired && P.cx >= w.at) this.fireWave(w);
      if (w.queue.length) for (let i = w.queue.length - 1; i >= 0; i--) { const q = w.queue[i]; q.t -= wdt; if (q.t <= 0) { w.queue.splice(i, 1); this.spawnEnemy(q.d, w.id); } }
    }
    // enemies
    for (const e of this.enemies) e.update(wdt);
    for (const w of this.waves) if (w.fired && !w.done && !w.queue.length && !this.enemies.some(e => e.wave === w.id && !e.dead && !e.remove)) w.done = true;
    this.enemies = this.enemies.filter(e => !e.remove && !(e.dead && e.deadT > 4 && !e.boss));
    // bullets: player rounds stay fast, enemy rounds obey world time
    for (const b of this.bullets.list) updateBullet(b, b.team === 'p' ? dt * (P.deActive ? 0.6 : 1) : wdt);
    sweepPool(this.bullets);
    for (const d of this.dyns) updateDynamite(d, wdt);
    this.dyns = this.dyns.filter(d => !d.dead);
    for (const r of this.rocks) updateRock(r, wdt);
    this.rocks = this.rocks.filter(r => !r.dead);
    for (const h of this.hazards) updateHazard(h, wdt);
    for (let i = this.pendingBlasts.length - 1; i >= 0; i--) { const b = this.pendingBlasts[i]; b.t -= wdt; if (b.t <= 0) { this.pendingBlasts.splice(i, 1); explode(b.x, b.y, 56, 40 * this.diff.edmg, 160, b.byPlayer); } }
    if (this.wagon) this.wagon.update(wdt);
    // gates open when their waves are done
    for (const s of this.solids.slice()) if (s.kind === 'gate' && s.waves && s.waves.every(id => this.waveById[id] && this.waveById[id].done)) {
      this.removeSolid(s); Sound.play('gate', { x: s.x }); dust(s.x + 5, s.y + s.h, 10); smoke(s.x + 5, s.y + s.h - 20, 6, '#c8a878');
      this.banner('THE WAY IS OPEN', '', 1.4);
    }
    this.updatePickups(wdt);
    // particles
    for (const p of this.parts.list) {
      p.life -= wdt; if (p.life <= 0) { p.dead = true; continue; }
      if (p.type === 'stuck') continue;
      p.vy += p.grav * wdt; p.x += p.vx * wdt; p.y += p.vy * wdt;
      if (p.type === 'smoke') { p.vx *= 0.98; p.size += wdt * 4; }
      if (p.bounce && p.vy > 0 && pointSolid(p.x, p.y)) { p.y -= p.vy * wdt; p.vy *= -0.35; p.vx *= 0.6; if (p.type === 'shell' && Math.abs(p.vy) > 30) Sound.play('shell', { x: p.x }); }
    }
    sweepPool(this.parts);
    for (const n of this.nums.list) { n.life -= dt; n.y += n.vy * dt; n.vy *= 0.94; if (n.life <= 0) n.dead = true; }
    sweepPool(this.nums);
    for (const f of this.flashes) f.life -= wdt;
    this.flashes = this.flashes.filter(f => f.life > 0);
    // checkpoints
    if (P.alive && this.state === 'play') for (let i = this.cps.length - 1; i >= 0; i--) {
      const cp = this.cps[i];
      if (cp.active) break;
      if (P.cx >= cp.x) {
        for (let j = 0; j <= i; j++) this.cps[j].active = true;
